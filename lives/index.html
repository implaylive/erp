<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMPlay · Lives de hoje e amanhã</title>
<meta name="description" content="Agenda pública das lives da IMPlay: hoje e amanhã.">
<link rel="icon" href="../icon-v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,700;12..96,75..100,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0b18;--card:#2a1225;--line:#3d1d36;--volt:#D5FF3F;--flash:#EF8FC4;--txt:#f6f1f4;--mut:#b9a4b3;--fh:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header img{height:38px}
.clock{font-family:var(--fh);font-size:15px;color:var(--mut);text-align:right}
.clock b{display:block;color:var(--txt);font-size:26px;letter-spacing:-.5px}
h1{font-family:var(--fh);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:26px 0 4px;letter-spacing:-1px}
h1 span{color:var(--volt)}
.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
h2{font-family:var(--fh);font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2 .n{background:var(--line);color:var(--txt);border-radius:99px;padding:2px 9px;font-size:12px;letter-spacing:0}
.list{display:grid;gap:10px}
.live{display:grid;grid-template-columns:118px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.live.on{border-color:var(--volt);box-shadow:0 0 0 1px var(--volt) inset,0 8px 30px rgba(213,255,63,.12)}
.live.past{opacity:.45}
.hr{font-family:var(--fh);font-weight:800;font-size:22px;letter-spacing:-.5px;line-height:1}
.hr small{display:block;font-family:Figtree;font-weight:500;font-size:12px;color:var(--mut);margin-top:4px;letter-spacing:0}
.mk{font-family:var(--fh);font-weight:700;font-size:19px;line-height:1.2}
.meta{color:var(--mut);font-size:13px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.pf{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pf.tt{background:#000;color:#fff;box-shadow:-1.5px 0 0 #25F4EE,1.5px 0 0 #FE2C55}
.pf.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}
.pf.ot{background:var(--line);color:var(--txt)}
.st{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--mut)}
.st.on{background:var(--volt);color:#1c0b18;animation:pulse 1.6s infinite}
.st.soon{background:rgba(239,143,196,.18);color:var(--flash)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(213,255,63,.6)}50%{box-shadow:0 0 0 7px rgba(213,255,63,0)}}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--mut);text-align:center}
footer{margin-top:40px;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:620px){.live{grid-template-columns:1fr auto;gap:6px 12px}.hr{grid-column:1/-1;font-size:19px}.hr small{display:inline;margin-left:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../logo.png" alt="IMPlay"><div class="clock"><b id="hora">--:--</b><span id="dia"></span></div></header>
  <h1>Lives de <span>hoje</span> e amanhã</h1>
  <p class="sub">Agenda ao vivo da IMPlay · atualiza sozinha a cada minuto</p>
  <div id="app"><div class="empty">Carregando…</div></div>
  <footer>IMPlay Live Commerce · Av. Paulista, 2198 · São Paulo</footer>
</div>
<script>
const SB_URL="https://agdqlnaedojcgivwluty.supabase.co",SB_KEY="sb_publishable_PKGxxrfpduzI7xY1_DWQyQ_cnJA9isP";
const TZ="America/Sao_Paulo";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=d=>d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const ymd=d=>d.toLocaleDateString("en-CA",{timeZone:TZ});
const pf=p=>{const k=String(p||"").toLowerCase();return k.includes("insta")?`<span class="pf ig">◎ Instagram</span>`:k.includes("tik")?`<span class="pf tt">♪ TikTok</span>`:`<span class="pf ot">${esc(p||"Live")}</span>`};
let DATA=[],ERR="";
function tick(){const n=new Date();document.getElementById("hora").textContent=hm(n);
  document.getElementById("dia").textContent=n.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",timeZone:TZ});render()}
function card(l,now){const i=new Date(l.inicio),f=new Date(l.fim||l.inicio);const dur=Math.round((f-i)/36e5*10)/10;
  const on=now>=i&&now<f,past=now>=f,soon=!on&&!past&&(i-now)<60*60e3;
  const st=on?`<span class="st on">● AO VIVO</span>`:past?`<span class="st">Encerrada</span>`:soon?`<span class="st soon">Em ${Math.max(1,Math.round((i-now)/6e4))} min</span>`:`<span class="st">Agendada</span>`;
  return `<div class="live ${on?"on":""} ${past?"past":""}"><div class="hr">${hm(i)}<small>até ${hm(f)}${dur?` · ${String(dur).replace(".",",")} h`:""}</small></div>
  <div><div class="mk">${esc(l.marca||"Live")}</div><div class="meta">${pf(l.plataforma)}<span>📍 ${esc(l.local)}</span>${l.seller?`<span>🎤 ${esc(l.seller)}</span>`:""}</div></div>${st}</div>`}
function render(){const app=document.getElementById("app");
  if(ERR){app.innerHTML=`<div class="empty">Não foi possível carregar a agenda agora. Tentando de novo em 1 minuto.</div>`;return}
  const now=new Date(),hoje=ymd(now),am=ymd(new Date(now.getTime()+864e5));
  const H=DATA.filter(l=>ymd(new Date(l.inicio))===hoje),A=DATA.filter(l=>ymd(new Date(l.inicio))===am);
  const agora=H.filter(l=>now>=new Date(l.inicio)&&now<new Date(l.fim||l.inicio));
  const sec=(t,l,vazio)=>`<h2>${t} <span class="n">${l.length}</span></h2>${l.length?`<div class="list">${l.map(x=>card(x,now)).join("")}</div>`:`<div class="empty">${vazio}</div>`}`;
  const dA=new Date(now.getTime()+864e5).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",timeZone:TZ});
  app.innerHTML=(agora.length?sec("Ao vivo agora",agora,""):"")+sec("Hoje",H,"Nenhuma live hoje.")+sec("Amanhã · "+dA,A,"Nenhuma live amanhã.")}
async function load(){try{const r=await fetch(SB_URL+"/rest/v1/rpc/imp_lives_publico",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:"{}"});
  if(!r.ok)throw new Error(r.status);DATA=await r.json();ERR=""}catch(e){ERR=String(e)}render()}
tick();load();setInterval(tick,15e3);setInterval(load,60e3);
</script>
</body>
</html>
