<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMPlay · Agenda de lives</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--volt:#D5FF3F;--bg:#000;--card:#111;--line:#262626;--mut:#9a9a9a;--warn:#FFB84D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.logo{height:34px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut);font-size:13px}
.dia{margin-top:18px;font-weight:700;text-transform:capitalize;color:var(--volt);font-size:14px}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.it b{font-size:16px;min-width:118px}.pl{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:22px}
input,textarea{width:100%;background:#0a0a0a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;margin-top:6px}
textarea{min-height:80px}
.bt{display:block;width:100%;border:0;border-radius:99px;padding:13px;font:600 15px inherit;margin-top:10px;cursor:pointer}
.ok{background:var(--volt);color:#000}.aj{background:transparent;color:#fff;border:1px solid var(--line)}
.st{border-radius:12px;padding:12px 14px;margin-top:18px;font-size:14px}.st.a{background:rgba(213,255,63,.12);border:1px solid var(--volt)}.st.j{background:rgba(255,184,77,.12);border:1px solid var(--warn)}
.err{color:#ff6b6b}
</style>
</head>
<body><div class="w" id="app"><img class="logo" src="../logo.png" alt="IMPlay"><p class="mut">Carregando…</p></div>
<script>
"use strict";
const db=window.supabase.createClient("https://agdqlnaedojcgivwluty.supabase.co","sb_publishable_PKGxxrfpduzI7xY1_DWQyQ_cnJA9isP",{auth:{persistSession:false}});
const T=new URLSearchParams(location.search).get("t")||"";const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
const dd=s=>{const [y,m,d]=s.split("-");return d+"/"+m};
let E=null,modo="";
function draw(){const a=$("#app");if(!E){a.innerHTML=`<img class="logo" src="../logo.png" alt="IMPlay"><h1>Link inválido</h1><p class="mut">Peça um novo link para a equipe IMPlay.</p>`;return}
  let h=`<img class="logo" src="../logo.png" alt="IMPlay"><h1>Agenda de lives · ${esc(E.marca||"")}</h1><div class="mut">${dd(E.ini)} a ${dd(E.fim)} · ${(E.itens||[]).length} lives</div>`;let dia="";
  (E.itens||[]).slice().sort((x,y)=>new Date(x.inicio)-new Date(y.inicio)).forEach(i=>{const d=new Date(i.inicio).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"});if(d!==dia){dia=d;h+=`<div class="dia">${esc(d)}</div>`}
    h+=`<div class="it"><b>${hm(i.inicio)} às ${hm(i.fim||i.inicio)}</b>${i.plataforma?`<span class="pl">${esc(i.plataforma)}</span>`:""}</div>`});
  if(E.status==="aprovado")h+=`<div class="st a">✅ Agenda aprovada por <b>${esc(E.resposta_nome||"")}</b> em ${new Date(E.resposta_em).toLocaleString("pt-BR")}. Obrigado!</div>`;
  else if(E.status==="ajuste")h+=`<div class="st j">✏️ Ajuste pedido por <b>${esc(E.resposta_nome||"")}</b>: ${esc(E.resposta_obs||"")}<br><span class="mut">A equipe IMPlay vai ajustar e mandar a agenda de novo.</span></div>`;
  else h+=`<div class="box"><b>Está tudo certo?</b><div class="mut">Confira os dias e horários acima.</div><input id="nome" placeholder="Seu nome" autocomplete="name">
    ${modo==="aj"?`<textarea id="obs" placeholder="O que precisa mudar? Ex.: terça às 19h, e não às 18h"></textarea><button class="bt ok" id="env">Enviar pedido de ajuste</button><button class="bt aj" id="vol">Voltar</button>`
    :`<button class="bt ok" id="ok">✅ Aprovar a agenda</button><button class="bt aj" id="aj">✏️ Preciso de ajuste</button>`}<div id="msg" class="err"></div></div>`;
  a.innerHTML=h;
  const nm=$("#nome");if(nm)try{nm.value=localStorage.getItem("imp-ok-nome")||""}catch(_){}
  const resp=async(ok)=>{const n=($("#nome").value||"").trim();const o=ok?"":($("#obs").value||"").trim();if(!n)return $("#msg").textContent="Escreva seu nome.";if(!ok&&!o)return $("#msg").textContent="Diga o que precisa mudar.";
    try{localStorage.setItem("imp-ok-nome",n)}catch(_){}
    const r=await db.rpc("imp_cal_responder",{p_token:T,p_ok:ok,p_nome:n,p_obs:o||null});if(r.error||!r.data)return $("#msg").textContent="Não deu certo. Tente de novo.";
    E.status=ok?"aprovado":"ajuste";E.resposta_nome=n;E.resposta_obs=o;E.resposta_em=new Date().toISOString();draw()};
  if($("#ok"))$("#ok").onclick=()=>resp(true);if($("#env"))$("#env").onclick=()=>resp(false);
  if($("#aj"))$("#aj").onclick=()=>{try{localStorage.setItem("imp-ok-nome",$("#nome").value||"")}catch(_){}modo="aj";draw()};if($("#vol"))$("#vol").onclick=()=>{modo="";draw()}}
(async()=>{if(T.length>=24){const r=await db.rpc("imp_cal_ver",{p_token:T});E=r.data||null}draw()})();
</script>
</body></html>
