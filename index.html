<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--noite:#000000;--bg2:#0A0A0A;--card:#141414;--card2:#1C1C1C;--linha:#262626;--linha2:#333333;--chalk:#F3F3EC;--cinza:#A3A3AB;--grafite:#5F5F67;
--volt:#D5FF3F;--voltx:var(--volt);--flash:#EF8FC4;--cobalt:#561D45;--ameixa:#561D45;--oliva:#C9DB82;--ok:#7CE38B;--warn:#FFB547;--bad:#FF5C6C;
--fh:Figtree,system-ui,-apple-system,sans-serif;--fb:"Bricolage Grotesque",Figtree,sans-serif;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);--side:244px;--rail:310px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--noite);color:var(--chalk);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.uh{font-family:var(--fh);letter-spacing:-.01em;margin:0;font-weight:700}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* logo */
.logo{font-family:var(--fh);font-weight:800;font-size:24px;color:var(--voltx);text-shadow:2px 2px 0 var(--flash);position:relative;display:inline-block;line-height:1}
.logo .sp{color:var(--flash);font-size:12px;position:absolute;left:27px;top:-8px;text-shadow:none}
.live{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--flash);text-transform:uppercase}
/* ===== shell ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--bg2);border-right:1px solid var(--linha);padding:calc(20px + var(--safe-t)) 12px calc(14px + var(--safe-b));overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.sbrand{padding:4px 10px 18px}
.sbrand .tagline{font-size:11px;color:var(--cinza);margin-top:10px;line-height:1.4}
.sgrp{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grafite);padding:14px 12px 6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:12px;padding:8px 12px;min-height:46px;text-align:left;cursor:pointer;color:var(--chalk);margin-bottom:2px}
.sitem:hover{background:var(--card)}
.sitem .sl{flex:1;min-width:0;display:flex;flex-direction:column}
.sitem .sl b{font-weight:600;font-size:13.5px}
.sitem .sl small{font-size:11px;color:var(--cinza);margin-top:1px}
.sitem svg{color:var(--cinza)}
.sitem.on{background:var(--volt);color:#000}
.sitem.on svg,.sitem.on small{color:#2a3300}
.sbad{background:var(--flash);color:#131411;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px}
.sitem.on .sbad{background:#000;color:var(--voltx)}
.sfoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--linha);font-size:12px;color:var(--cinza)}
.scrim{display:none}
.main{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-t)) 28px 14px;background:color-mix(in srgb,var(--noite) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.burger{display:none;border:1px solid var(--linha);background:var(--card);border-radius:12px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:10px 14px 10px 38px;font-size:13.5px;min-height:40px}
.gsearch svg{position:absolute;left:13px;top:11px;color:var(--cinza);width:17px;height:17px}
.gres{position:absolute;left:0;right:0;top:46px;background:var(--card2);border:1px solid var(--linha2);border-radius:14px;padding:6px;box-shadow:0 20px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto}
.gres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.gres button:hover{background:var(--card)}
.gres .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--cinza);text-transform:uppercase;width:72px;flex:0 0 auto;padding-top:2px}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.chipbtn{border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:600;font-size:12.5px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bell{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--linha);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell .dotn{position:absolute;top:-3px;right:-3px;background:var(--flash);color:#131411;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.avatar{display:flex;align-items:center;gap:10px;padding-left:6px}
.avatar .av{width:36px;height:36px;border-radius:999px;background:var(--volt);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:13px}
.avatar .nm{font-weight:700;font-size:13px;line-height:1.2}.avatar .rl{font-size:11px;color:var(--cinza)}
.content{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:22px;padding:22px 28px calc(60px + var(--safe-b))}
.content.norail{grid-template-columns:minmax(0,1fr)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:20px}
.pagehead .sub{font-size:12px;color:var(--cinza);margin-top:4px}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:1379px){.content{grid-template-columns:minmax(0,1fr)}.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media(max-width:899px){
 .side{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
 .shell.open .side{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
 .main{margin-left:0}
 .burger{display:inline-flex}
 .topbar{padding:calc(10px + var(--safe-t)) 14px 10px}
 .content{padding:16px 14px calc(60px + var(--safe-b));gap:16px}
 .avatar .tx,.hideM{display:none}
 .gsearch{max-width:none}
}
/* ===== blocks ===== */
.panel{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px;min-width:0}
.panel h3{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.panel h3 a{font-family:Figtree,system-ui,sans-serif;font-size:12px;font-weight:600;color:var(--cinza);text-decoration:none;cursor:pointer}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.hero .kick{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--cinza);text-transform:uppercase}
.hero h2{font-size:30px;line-height:1.08;margin-top:12px;font-weight:800}
.hero h2 em{font-style:normal;color:var(--voltx)}
.hero p{color:var(--cinza);margin:12px 0 0;font-size:13px;max-width:440px}
.hero .stk{position:absolute;right:22px;top:18px;background:var(--flash);color:#131411;font-family:var(--fh);font-weight:800;font-size:12px;padding:6px 12px;border-radius:10px;transform:rotate(-5deg)}
.floor{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.floor .b{border-radius:9px;background:var(--card2);border:1px solid var(--linha);padding:7px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--grafite)}
.floor .b.on{background:var(--flash);border-color:var(--flash);color:#131411}
.floor .b.v{background:var(--volt);border-color:var(--volt);color:#000}
.floorlg{display:flex;gap:12px;font-size:11px;color:var(--cinza);margin-top:10px;flex-wrap:wrap}
.floorlg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:24px}}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media(max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px 16px;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--linha2)}
.stage .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--cinza)}
.stage .n{font-family:var(--fh);font-weight:700;font-size:clamp(16px,1.5vw,22px);margin-top:8px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .n small{font-family:Figtree,system-ui,sans-serif;font-size:11.5px;font-weight:600;color:var(--cinza)}
.stage.v{background:var(--volt);color:#000;border-color:var(--volt)}.stage.v .h,.stage.v small{color:#2a3300}
.stage.c{background:var(--cobalt);border-color:var(--cobalt)}.stage.c .h,.stage.c small{color:#dfe2ff}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px;min-width:0}
.kpi .n{font-family:var(--fh);font-weight:700;font-size:clamp(15px,1.7vw,19px);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
.kpi.cob{background:var(--cobalt);border-color:var(--cobalt)}.kpi.cob .l{color:#dfe2ff}
.kpi.vol{background:var(--volt);color:#000;border-color:var(--volt)}.kpi.vol .l{color:#2a3300}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.sec h2{font-size:14px}
.muted{color:var(--cinza)}.small{font-size:11.5px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* toolbar + filters */
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool .q{position:relative;flex:1 1 220px;max-width:340px}
.tool .q input{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:9px 12px 9px 34px;min-height:38px;font-size:13px}
.tool .q svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--cinza)}
.tool select{background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:8px 12px;min-height:38px;font-size:12.5px;max-width:200px}
.tool select.on{border-color:var(--volt);color:var(--voltx)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--linha);background:transparent;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;min-height:34px;cursor:pointer;color:var(--chalk)}
.chips button .c{color:var(--cinza);margin-left:4px;font-weight:600}
.chips button.on{background:var(--volt);color:#000;border-color:var(--volt)}
.chips button.on .c{color:#2a3300}
/* table */
.tblw{background:var(--card);border:1px solid var(--linha);border-radius:18px;overflow-x:auto}
@media(min-width:761px){td[data-l=Quando],td[data-l=Data]{white-space:nowrap}}
table.tb{width:100%;border-collapse:collapse}
table.tb th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:left;padding:12px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.tb td{padding:12px 14px;border-bottom:1px solid var(--linha);vertical-align:middle;font-size:13px}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr{cursor:pointer}
table.tb tbody tr:hover{background:var(--card2)}
table.tb .t{font-weight:700}
table.tb .s{font-size:11.5px;color:var(--cinza);margin-top:2px}
table.tb .r{text-align:right;white-space:nowrap;font-weight:700}
.tfoot{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--cinza);border-top:1px solid var(--linha);background:var(--bg2)}
@media(max-width:760px){
 table.tb thead{display:none}
 table.tb,table.tb tbody,table.tb tr,table.tb td{display:block;width:100%}
 table.tb tr{padding:12px 14px;border-bottom:1px solid var(--linha)}
 table.tb td{border:0;padding:3px 0}
 table.tb td[data-l]:not(.m0)::before{content:attr(data-l);display:inline-block;min-width:86px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grafite)}
 table.tb .r{text-align:left}
 table.tb td.hm{display:none}
}
.dots{display:flex;align-items:flex-start;gap:0}
.dots .st{display:flex;flex-direction:column;align-items:center;width:48px;position:relative;font-size:9.5px;color:var(--grafite);text-align:center}
.dots .st::before{content:"";position:absolute;top:5px;left:-24px;width:48px;height:2px;background:var(--linha2);z-index:0}
.dots .st:first-child::before{display:none}
.dots .st i{width:12px;height:12px;border-radius:99px;border:2px solid var(--linha2);background:var(--card);position:relative;z-index:1;margin-bottom:4px}
.dots .st.ok i{background:var(--volt);border-color:var(--volt)}
.dots .st.ok::before{background:var(--volt)}
.dots .st.ok{color:var(--chalk)}
.dots .st.cur i{box-shadow:0 0 0 4px rgba(212,255,47,.18)}
.dots .st.x i{background:var(--bad);border-color:var(--bad)}
/* rail */
.tl{display:flex;flex-direction:column;gap:10px}
.tl .e{display:grid;grid-template-columns:46px 10px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.tl .e .h{font-family:var(--fh);font-size:12px;color:var(--cinza);padding-top:1px}
.tl .e .d{width:10px;height:10px;border-radius:99px;background:var(--volt);margin-top:4px}
.tl .e .d.f{background:var(--flash)}

/* ---------- utilidades ---------- */
function $(s,r=document){return r.querySelector(s)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function brl(v){return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function num(v){if(v===null||v===undefined||v==="")return null;const n=Number(String(v).replace(/\./g,"").replace(",","."));return isNaN(n)?null:n}
function numIn(v){return v===null||v===undefined?"":String(v).replace(".",",")}
const DS=["dom","seg","ter","qua","qui","sex","sáb"],DL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],ML=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}/* semana começa no domingo */
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dExt(d){if(!d)return"";d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return DL[d.getDay()]+", "+d.getDate()+" de "+ML[d.getMonth()]}
function dCurta(d){if(!d)return"—";d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return DS[d.getDay()]+" "+d.getDate()+"/"+MS[d.getMonth()]}
function hm(d){d=new Date(d);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function horas(a,b){const h=(new Date(b)-new Date(a))/36e5;return (Math.round(h*10)/10).toString().replace(".",",")+" h"}
function jn(n){return "L-"+String(n||0).padStart(4,"0")}
function pn(n){return "P-"+String(n||0).padStart(4,"0")}
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,err?4500:2200)}
function nome(id){const m=S.membros.find(x=>x.id===id);return m?m.nome:""}
function cliNome(id){const c=S.clientes.find(x=>x.id===id);return c?c.marca:""}
function isSocio(){return S.me&&S.me.papel==="socio"}
function hourOpts(sel){const hs=[...Array.from({length:16},(_,i)=>i+8),...Array.from({length:8},(_,i)=>i)];
  return hs.map(h=>{const lab=(h%12===0?12:h%12)+" "+(h<12?"AM":"PM");return `<option value="${h}" ${h===sel?"selected":""}>${String(lab).padStart(5,"0")}</option>`}).join("")}
function minOpts(sel){return [0,15,30,45].map(m=>`<option value="${m}" ${m===sel?"selected":""}>${String(m).padStart(2,"0")}</option>`).join("")}
function timeSel(name,d){const h=d?d.getHours():10,m=d?Math.round(d.getMinutes()/15)*15%60:0;
  return `<div class="time"><select name="${name}_h">${hourOpts(h)}</select><select name="${name}_m">${minOpts(m)}</select></div>`}
function seg(name,opts,val,cls=""){return `<input type="hidden" name="${name}" value="${esc(val??"")}"><div class="seg ${cls}" data-seg="${name}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<button type="button" data-v="${esc(v)}" class="${String(v)===String(val??"")?"on":""}">${esc(l)}</button>`}).join("")}</div>`}
function dLong(v){if(!v)return"";const d=parseYmd(v);return DL[d.getDay()]+", "+d.getDate()+" de "+ML[d.getMonth()]+" de "+d.getFullYear()}
function dateFld(name,label,val,req){const ref=val?parseYmd(val):new Date();return `<div class="fld"><label>${label}</label><input type="hidden" name="${name}" value="${val||""}"><div class="dsel ${val?"":"vazio"}" data-dsel="${name}"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>${val?dLong(val):"Toque no dia abaixo"}</span></div><div class="cal" data-cal="${name}" data-m="${ymd(ref)}">${calHtml(name,ref,val||"")}</div></div>`}
function espSeg(val){const G=ESP_G;return `<input type="hidden" name="espaco" value="${esc(val||"")}"><div class="espg" data-seg="espaco">${G.map(([k,l])=>`<div class="erow"><span class="elab">${l}</span><div class="ebtns">${ESPACOS.filter(e=>e[0]===k).map(e=>`<button type="button" data-v="${e}" class="${e===val?"on":""}">${e}</button>`).join("")}</div></div>`).join("")}</div>`}
function calHtml(name,ref,sel){const today=new Date();
  const first=new Date(ref.getFullYear(),ref.getMonth(),1);const start=new Date(first);start.setDate(1-first.getDay());
  const jobsDia={};S.jobs.forEach(j=>{if(j.status==="cancelado")return;const k=ymd(new Date(j.inicio));jobsDia[k]=(jobsDia[k]||0)+1});
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    cells+=`<button type="button" class="cd ${d.getMonth()!==ref.getMonth()?"out":""} ${sameDay(d,today)?"hj":""} ${k===sel?"sel":""}" data-act="calPick" data-n="${name}" data-v="${k}">${d.getDate()}${jobsDia[k]?`<i>${jobsDia[k]}</i>`:""}</button>`}
  return `<div class="ch"><button type="button" data-act="calNav" data-n="${name}" data-m="-1">‹</button><b>${ML[ref.getMonth()]} ${ref.getFullYear()}</b><button type="button" data-act="calNav" data-n="${name}" data-m="1">›</button></div>
  <div class="cw">${["dom","seg","ter","qua","qui","sex","sáb"].map(x=>`<span>${x}</span>`).join("")}</div><div class="cg">${cells}</div>
  <div class="cf"><button type="button" data-act="calPick" data-n="${name}" data-v="${ymd(today)}">Hoje</button><button type="button" data-act="calPick" data-n="${name}" data-v="${ymd(new Date(Date.now()+864e5))}">Amanhã</button><button type="button" data-act="calPick" data-n="${name}" data-v="">Limpar</button><span class="muted">número rosa = lives no dia</span></div>`}
function calShow(name,ref){const c=$(`#sheetIn [data-cal="${name}"]`);const v=$(`#sheetIn [name="${name}"]`).value;c.dataset.m=ymd(ref);c.innerHTML=calHtml(name,ref,v);c.hidden=false}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const n=a.dataset.n;
  if(a.dataset.act==="calOpen"){e.stopImmediatePropagation();const c=$(`#sheetIn [data-cal="${n}"]`);const open=!c.hidden;document.querySelectorAll("#sheetIn .cal").forEach(x=>x.hidden=true);if(open)return;const v=$(`#sheetIn [name="${n}"]`).value;calShow(n,v?parseYmd(v):new Date())}

async function run(p,okMsg){const {data,error}=await p;if(error){console.warn(error);toast(traduz(error.message),true);throw error}if(okMsg)toast(okMsg);return data}
function traduz(m){m=m||"";if(/row-level security/i.test(m)){const t=(m.match(/table "([^"]+)"/)||[])[1]||"";return"Sem permissão no banco"+(t?" ("+t+")":"")+". Rode o SQL de correção ou fale com um sócio.";}if(/Failed to fetch|network/i.test(m))return"Sem conexão. Tente de novo.";return m}

/* ---------- dados ---------- */
async function loadAll(){
  const q=(t,o="created_at",asc=false)=>db.from(t).select("*").order(o,{ascending:asc});
  const [m,c,p,j,f,a,k]=await Promise.all([q("imp_membros","nome",true),q("imp_clientes","marca",true),q("imp_propostas","numero"),q("imp_jobs","inicio",true),q("imp_fin"),q("imp_amostras","data"),db.from("imp_kyc").select("*")]);
  S.kyc=(k&&!k.error&&k.data)||[];
  const [fx,ex,sd]=await Promise.all([db.from("imp_fixas").select("*").order("nome",{ascending:true}),db.from("imp_extrato").select("*").order("data",{ascending:false}),db.from("imp_saldos").select("*").order("data",{ascending:false})]);
  S.fxSemSQL=!!(fx.error);S.fixas=fx.data||[];S.extrato=ex.data||[];S.saldos=sd.data||[];
  if(typeof ctrLoad==="function")await ctrLoad();
  for(const r of [m,c,p,j,f,a]) if(r.error){console.warn(r.error)}
  S.membros=m.data||[];S.clientes=c.data||[];S.propostas=p.data||[];S.jobs=j.data||[];S.fin=f.data||[];S.amostras=a.data||[];
}
async function refresh(){if(!S.me||document.hidden)return;try{await loadAll();if($("#sheet").hidden&&$("#doc").hidden)render()}catch(e){console.warn(e)}}

/* ---------- login ---------- */
function renderLogin(msg){
  $("#app").innerHTML=`<div class="login"><div style="text-align:center;margin-bottom:22px"><img class="logoimg big" src="${LOGO_LIMA}" alt="IMPlay"><div class="live" style="margin-top:14px">● ERP · gestão de live commerce</div></div>
  <form class="card" id="lf"><div class="fld" style="margin-top:0"><label>E-mail</label><input type="email" name="email" autocomplete="username" required></div>
  <div class="fld"><label>Senha</label><input type="password" name="senha" autocomplete="current-password" required minlength="6"></div>
  ${msg?`<div class="warnbox">${esc(msg)}</div>`:""}
  <div class="row" style="margin-top:18px"><button class="btn p" style="flex:1">Entrar</button><button type="button" class="btn" id="criar">Pedir acesso</button></div><div class="small muted" style="margin-top:10px;text-align:center">Quem cria conta entra numa lista de pedidos. Só depois que um sócio libera em Equipe é que dá para ver e mexer no ERP.</div>
  <div class="hint">Use o mesmo e-mail e senha da Agenda. Sócios e equipe entram aqui. Sellers usam o app do seller.</div></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const {error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("senha")});
    if(error)return renderLogin("Não entrou: "+(error.message.includes("Invalid")?"e-mail ou senha errados.":error.message));boot()};
  $("#criar").onclick=async()=>{const f=new FormData($("#lf"));if(!f.get("email")||String(f.get("senha")).length<6)return toast("Preencha e-mail e senha (mín. 6)",true);
    const {error}=await db.auth.signUp({email:f.get("email"),password:f.get("senha")});if(error)return renderLogin(error.message);boot()};
}
async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return renderLogin();
  const {data:me,error}=await db.rpc("imp_entrar",{p_app:"erp"});
  if(error){return renderLogin("Erro ao entrar: "+error.message+" (o SQL da Implay já foi rodado no Supabase?)")}
  if(!me||!me.id||me.papel==="seller"||me.status!=="ativo"){
    $("#app").innerHTML=`<div class="login"><div class="card"><h3>Sem acesso ao ERP</h3><p class="muted">Seu e-mail <b>${esc(session.user.email)}</b> ${me&&me.papel==="seller"?"está cadastrado como seller. Use o app do seller.":me&&me.status==="pendente"?"já está na lista de <b>pedidos de acesso</b>. Avise um sócio: ele libera em Equipe. Depois toque em Atualizar.":me&&me.status==="inativo"?"está com o acesso desativado. Fale com um sócio.":"ainda não foi liberado. Peça a um sócio para te cadastrar em Equipe com este e-mail."}</p><div class="row"><button class="btn p" onclick="location.reload()">Atualizar</button><button class="btn" id="sair">Sair</button></div></div></div>`;
    $("#sair").onclick=async()=>{await db.auth.signOut();renderLogin()};return}
  S.me=me;S.email=session.user.email;await loadAll();render();
}

function finAberto(tipo){return S.fin.filter(f=>f.status==="ativo"&&f.tipo===tipo&&!f.pago_em)}
function soma(arr){return arr.reduce((s,f)=>s+(Number(f.valor)||0),0)}
function aporteInfo(){
  const ap=S.fin.filter(f=>f.status==="ativo"&&f.categoria==="aporte"&&f.pago_em);
  const dev=S.fin.filter(f=>f.status==="ativo"&&f.categoria==="devolucao_aporte"&&f.pago_em);
  const tot=soma(ap),dv=soma(dev);
  let prazo=null;ap.forEach(a=>{const d=parseYmd(a.pago_em);d.setMonth(d.getMonth()+18);if(!prazo||d<prazo)prazo=d});
  return {tot,dv,saldo:tot-dv,prazo,ap}
}
const VIEWS={};
/* ================= AGENDA ================= */
function conflitos(lista){
  const out=[];const ab=lista.filter(j=>j.status!=="cancelado");
  for(let i=0;i<ab.length;i++)for(let k=i+1;k<ab.length;k++){const a=ab[i],b=ab[k];
    if(new Date(a.inicio)<new Date(b.fim)&&new Date(b.inicio)<new Date(a.fim)){
      if(a.local_tipo==="estudio"&&b.local_tipo==="estudio"&&a.espaco&&a.espaco===b.espaco)out.push(`Espaço ${a.espaco}: ${jn(a.numero)} e ${jn(b.numero)} no mesmo horário`);
      const pa=[a.principal_id,a.substituto_id].filter(Boolean),pb=[b.principal_id,b.substituto_id].filter(Boolean);
      pa.filter(x=>pb.includes(x)).forEach(x=>out.push(`${nome(x)} está em ${jn(a.numero)} e ${jn(b.numero)} ao mesmo tempo`));
    }}
  return out;
}
function jobCard(j){const open=!j.principal_id&&j.status==="aberto";
  return `<div class="jc ${platCls(j)} ${j.status==="realizado"?"done":open?"open":""}" data-act="job" data-id="${j.id}"><b>${hm(j.inicio)}–${hm(j.fim)}</b> · ${esc(j.marca||cliNome(j.cliente_id)||"")}${platTag(j)}<br>
  <span class="muted">${j.local_tipo==="estudio"?(j.espaco||"estúdio"):j.local_tipo==="cliente"?"local do cliente":"online"}</span><br>
  ${j.principal_id?`A: ${esc(nome(j.principal_id))}`:`<span style="color:var(--flash)">A: vaga aberta</span>`}${j.substituto_id?` · B: ${esc(nome(j.substituto_id))}`:""}</div>`}
VIEWS.agenda=()=>{
  const today=new Date();
  const head=`<div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="pills" style="margin:0"><button data-act="agView" data-v="semana" class="${S.agView==="semana"?"on":""}">Semana</button><button data-act="agView" data-v="mes" class="${S.agView==="mes"?"on":""}">Mês</button></div>
    <div class="row"><button class="btn sm" data-act="agNav" data-v="-1">‹</button><button class="btn sm" data-act="agHoje">hoje</button><button class="btn sm" data-act="agNav" data-v="1">›</button><button class="btn p sm" data-act="novoJob">+ Nova live</button></div></div>`;
  if(S.agView==="mes"){
    if(!S.agMes){const n=new Date();S.agMes=new Date(n.getFullYear(),n.getMonth(),1)}
    const mesHtml=ref=>{const start=mondayOf(new Date(ref.getFullYear(),ref.getMonth(),1));const last=new Date(ref.getFullYear(),ref.getMonth()+1,0);const nCel=Math.ceil((diasEntre(start,last)+1)/7)*7;let cells="";
      for(let i=0;i<nCel;i++){const d=new Date(start);d.setDate(start.getDate()+i);const fora=d.getMonth()!==ref.getMonth();
        const js=fora?[]:S.jobs.filter(j=>j.status!=="cancelado"&&sameDay(new Date(j.inicio),d)).sort((a,b)=>a.inicio<b.inicio?-1:1);
        cells+=`<div class="md ${fora?"out":""} ${sameDay(d,today)?"today":""} ${d<new Date(today.toDateString())?"past":""}">${fora?"":`<div class="mdh"><b data-act="agDia" data-v="${ymd(d)}" title="Ver a semana">${d.getDate()}</b><button class="madd" data-act="novoJobDia" data-v="${ymd(d)}" title="Nova live neste dia">+</button></div>
        ${js.slice(0,2).map(j=>`<div class="mj ${platCls(j)} ${!j.principal_id&&j.status==="aberto"?"open":""} ${j.status==="realizado"?"done":""}" data-act="job" data-id="${j.id}" title="${hm(j.inicio)} ${esc(j.marca||"")}${j.plataforma?" · "+esc(j.plataforma):""}${j.principal_id?" · "+esc(nome(j.principal_id)):" · vaga aberta"}"><b>${hm(j.inicio).replace(":00","h")}</b> ${esc(j.marca||cliNome(j.cliente_id)||"Live")}${j.principal_id?`<span> · ${esc(String(nome(j.principal_id)).split(" ")[0])}</span>`:""}</div>`).join("")}${js.length>2?`<div class="mmore" data-act="agDia" data-v="${ymd(d)}">+${js.length-2}</div>`:""}`}</div>`}
      const mjs=S.jobs.filter(j=>j.status!=="cancelado"&&new Date(j.inicio).getMonth()===ref.getMonth()&&new Date(j.inicio).getFullYear()===ref.getFullYear());
      return `<div class="m2"><div class="row" style="justify-content:space-between;margin-bottom:6px;align-items:baseline"><h2 style="font-size:16px;text-transform:capitalize;margin:0">${ML[ref.getMonth()]} ${ref.getFullYear()}</h2><span class="muted small">${mjs.length} lives · ${mjs.filter(j=>!j.principal_id&&j.status==="aberto").length} vagas</span></div><div class="mgrid big sm2">${DS.map(d=>`<div class="mwd">${d}</div>`).join("")}${cells}</div></div>`};
    const r1=S.agMes,r2=new Date(r1.getFullYear(),r1.getMonth()+1,1);
    return head+`<div class="muted small" style="margin:-4px 0 8px"><i class="lg a"></i>com seller <i class="lg b"></i>vaga aberta · toque no número do dia para ver a semana</div><div class="m2w">${mesHtml(r1)}${mesHtml(r2)}</div>`;
  }
  const days=[...Array(7)].map((_,i)=>{const d=new Date(S.week);d.setDate(d.getDate()+i);return d});
  const fimS=new Date(days[6]);fimS.setHours(23,59,59);
  const wk=S.jobs.filter(j=>j.status!=="cancelado"&&new Date(j.inicio)>=S.week&&new Date(j.inicio)<=fimS);
  const conf=conflitos(wk);
  return head+`<div class="muted small" style="margin-bottom:10px">${dCurta(days[0])} a ${dCurta(days[6])} · ${wk.length} lives · ${wk.filter(j=>!j.principal_id&&j.status==="aberto").length} vagas abertas</div>
  <div class="week">${days.map(d=>{const js=wk.filter(j=>sameDay(new Date(j.inicio),d));const occ=js.filter(j=>j.local_tipo==="estudio"&&j.espaco).map(j=>j.espaco);
   return `<div class="day ${sameDay(d,today)?"today":""}"><div class="dh"><span class="small muted">${DS[d.getDay()].toUpperCase()}</span><b>${d.getDate()}</b></div>
   ${js.length?js.map(jobCard).join(""):`<div class="small muted">livre</div>`}
   ${occ.length?`<div class="small muted" style="margin-top:6px">${new Set(occ).size}/${ESPACOS.length} espaços</div>`:""}</div>`}).join("")}</div>
  <div class="${conf.length?"warnbox":"okbox"}" style="margin-top:12px">${conf.length?conf.map(esc).join("<br>"):"✓ Sem conflito de espaço ou de seller nesta semana"}</div>`;
};

    valor_seller:app?num(f.valor_seller):null,seller_pago_por:f.seller_pago_por||"cliente",requisitos:app?(f.requisitos||null):null,publicado:app,
    principal_id:srv?(f.principal_id||null):null,substituto_id:srv?(f.substituto_id||null):null,obs:f.obs||null,plataforma:f.plataforma||null,promocoes:jobPromosLer()};
  if(row.principal_id&&row.principal_id===row.substituto_id)return toast("Principal e substituto precisam ser pessoas diferentes",true);

const EV_LAB={job_publicado:"Live publicada",condicoes_alteradas:"Condições alteradas",escolheu_principal:"Escolheu ser principal",escolheu_substituto:"Escolheu ser substituto",
  substituto_assumiu_principal:"Substituto assumiu como principal",cancelou:"Cancelou",convite_assumir_principal:"Convidado a assumir como principal",

function evTxt(e){let t=EV_LAB[e.tipo]||e.tipo;const d=e.detalhe||{};
  if(e.tipo==="cancelou")t+=` (${d.vaga||""}, ${d.prazo==="no_prazo"?"no prazo, sem prejuízo":"menos de 24h antes"}${d.motivo?" · motivo: "+d.motivo:""})`;
  if(e.tipo==="condicoes_alteradas"&&d.antes&&d.depois){const ch=[];if(d.antes.valor_seller!==d.depois.valor_seller)ch.push(`cachê ${brl(d.antes.valor_seller)} → ${brl(d.depois.valor_seller)}`);if(d.antes.inicio!==d.depois.inicio)ch.push(`horário ${dCurta(d.antes.inicio)} ${hm(d.antes.inicio)} → ${dCurta(d.depois.inicio)} ${hm(d.depois.inicio)}`);if(d.antes.publicado!==d.depois.publicado)ch.push(d.depois.publicado?"publicado no mural":"tirado do mural");if(ch.length)t+=": "+ch.join(" · ")}

  return t}

  else saved=await run(db.from("imp_propostas").insert(row).select().single(),silent?null:"Proposta criada");
  if(saved&&row.status==="aceita"&&!saved.contrato_numero){saved=await run(db.from("imp_propostas").update({contrato_numero:"C-"+String(saved.numero).padStart(4,"0")}).eq("id",saved.id).select().single(),"Virou contrato "+"C-"+String(saved.numero).padStart(4,"0"))}
  await loadAll();return saved;
}

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveFin(id){

  const cat=f.tipo==="entrada"?f.cat_e:f.cat_s;if(!cat)return toast("Escolha a categoria",true);
  const row={tipo:f.tipo,categoria:cat,natureza:f.tipo==="saida"?(f.natureza||null):null,valor,descricao:f.descricao||null,contraparte:f.contraparte||null,vencimento:f.vencimento||null,pago_em:f.pago_em||null,
    forma:f.forma||null,job_id:f.job_id||null,proposta_id:f.proposta_id||null,nf_numero:f.nf_numero||null,pago_por:f.tipo==="saida"?f.pago_por:"empresa"};
  if(f.fixa_id){row.fixa_id=f.fixa_id;row.competencia=f.competencia||null}if(f.extrato_id)row.extrato_id=f.extrato_id;
  const old=id?S.fin.find(x=>x.id===id):null;
  if(row.pago_por==="proprio"){row.reembolso=old&&!["nao","solicitado"].includes(old.reembolso)?old.reembolso:(f.reembolso||"solicitado");if(!old||!old.reembolso_para)row.reembolso_para=S.me.id}else if(!old||["nao","solicitado"].includes(old.reembolso)){row.reembolso="nao"}
  if(!row.pago_em&&row.pago_por==="proprio")row.pago_em=ymd(new Date());
  const fileIn=$("#sheetIn [data-foto]");let foto=null;if(fileIn&&fileIn.files[0]){try{foto=await compress(fileIn.files[0]);row.tem_comprovante=true}catch(e){toast("Não consegui ler a foto",true)}}

  else saved=await run(db.from("imp_fin").insert(row).select().single(),row.reembolso==="solicitado"?"Reembolso solicitado":"Lançado");

  closeSheet();await refresh();
}

function chips(key,opts,cur){return `<div class="chips">${opts.map(([k,l,n])=>`<button data-act="fchip" data-f="${key}" data-v="${k}" class="${cur===k?"on":""}">${l}${n!==undefined?`<span class="c">${n}</span>`:""}</button>`).join("")}</div>`}
function qbox(key,ph){return `<div class="q">${ic("search")}<input data-q="${key}" value="${esc(S.f[key].q)}" placeholder="${ph}"></div>`}
function fsel(key,field,label,opts){const cur=S.f[key][field];return `<select data-fsel="${key}.${field}" class="${cur?"on":""}"><option value="">${label}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(l)}</option>`).join("")}</select>`}
function has(q,...xs){if(!q)return true;q=q.toLowerCase();return xs.some(x=>String(x??"").toLowerCase().includes(q))}
function tbl(cols,rows,empty){return `<div class="tblw">${rows.length?`<table class="tb"><thead><tr>${cols.map(c=>`<th class="${c[1]||""}">${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`:`<div class="empty">${empty||"Nada encontrado."}</div>`}</div>`}

function jobSteps(j){
  const rec=S.fin.some(f=>f.job_id===j.id&&f.tipo==="entrada"&&f.pago_em&&f.status==="ativo");
  const st=[["Publicado",true],["Principal",!!j.principal_id],["Substituto",!!j.substituto_id],["Realizada",j.status==="realizado"],["Recebido",rec]];
  if(j.status==="cancelado")return `<div class="dots"><div class="st x"><i></i>Cancelado</div></div>`;
  let last=-1;st.forEach((s,i)=>{if(s[1])last=i});
  return `<div class="dots">${st.map((s,i)=>`<div class="st ${s[1]?"ok":""} ${i===last?"cur":""}"><i></i>${s[0]}</div>`).join("")}</div>`}
function jobRow(j){const open=!j.principal_id&&j.status==="aberto";
  return `<tr class="${platCls(j)}" data-act="job" data-id="${j.id}"><td class="m0"><div class="t">${esc(j.marca||cliNome(j.cliente_id)||"Live")}${platTag(j)}</div><div class="s">${jn(j.numero)}${j.produto?" · "+esc(j.produto):""}</div></td>
  <td data-l="Etapa" class="hm">${jobSteps(j)}</td>
  <td data-l="Quando"><div>${dCurta(j.inicio)}</div><div class="s">${hm(j.inicio)}–${hm(j.fim)} · ${horas(j.inicio,j.fim)}</div></td>
  <td data-l="Local">${j.local_tipo==="estudio"?"Estúdio "+(j.espaco||""):j.local_tipo==="cliente"?"Cliente":"Online"}${j.modalidade==="aluguel"?`<div><span class="tag c">aluguel</span></div>`:""}</td>
  <td data-l="Sellers">${(j.clt_ids||[]).map(x=>`<div>${esc(nome(x))} <span class="muted small">CLT</span></div>`).join("")}${j.convidados?`<div>${esc(j.convidados)}</div>`:""}${j.principal_id?`<div>A · ${esc(nome(j.principal_id))}</div>`:j.publicado&&j.status==="aberto"?`<span class="tag f">vaga aberta</span>`:(j.clt_ids||[]).length||j.convidados?"":"—"}${j.substituto_id?`<div class="s">B · ${esc(nome(j.substituto_id))}</div>`:""}</td>
  <td data-l="Cachê" class="r">${j.valor_seller?brl(j.valor_seller):"—"}</td>
  <td data-l="Status">${j.status==="realizado"?`<span class="tag o">realizada</span>`:j.status==="cancelado"?`<span class="tag x">cancelada</span>`:new Date(j.fim)<new Date()?`<span class="tag w">a fechar</span>`:open?`<span class="tag f">aberta</span>`:`<span class="tag v">confirmada</span>`}</td></tr>`}
const JCOLS=[["Live"],["Etapa","hm"],["Quando"],["Local"],["Sellers"],["Cachê","r"],["Status"]];

  const now=new Date(),hoje=new Date(now.toDateString()),fimSem=new Date(hoje.getTime()+7*864e5);
  const mesK=monthKey(now);
  const livesMes=S.jobs.filter(j=>j.status!=="cancelado"&&monthKey(new Date(j.inicio))===mesK);
  const neg=S.propostas.filter(p=>["rascunho","enviada"].includes(p.status));
  const ativos=S.propostas.filter(p=>p.status==="aceita"&&(!p.contrato_fim||parseYmd(p.contrato_fim)>=hoje));
  const vagas=S.jobs.filter(j=>j.status==="aberto"&&new Date(j.inicio)>now&&!j.principal_id);
  const occ=new Set(S.jobs.filter(j=>j.status!=="cancelado"&&j.local_tipo==="estudio"&&j.espaco&&sameDay(new Date(j.inicio),now)).map(j=>j.espaco));
  const occNow=new Set(S.jobs.filter(j=>j.status!=="cancelado"&&j.local_tipo==="estudio"&&j.espaco&&new Date(j.inicio)<=now&&new Date(j.fim)>now).map(j=>j.espaco));
  const st=S.f.painel.st;

  const cnt={hoje:l.filter(j=>sameDay(new Date(j.inicio),now)).length,semana:l.filter(j=>new Date(j.fim)>now&&new Date(j.inicio)<fimSem).length,vagas:vagas.length,todas:l.filter(j=>new Date(j.fim)>now).length};
  if(st==="hoje")l=l.filter(j=>sameDay(new Date(j.inicio),now));else if(st==="semana")l=l.filter(j=>new Date(j.fim)>now&&new Date(j.inicio)<fimSem);else if(st==="vagas")l=vagas;else l=l.filter(j=>new Date(j.fim)>now);
  const ent=S.fin.filter(f=>f.status==="ativo"&&f.tipo==="entrada"&&f.pago_em&&f.pago_em.slice(0,7)===mesK&&f.categoria!=="aporte");

   <div class="row" style="margin-top:16px"><button class="btn p sm" data-act="novoJob">+ Nova live</button><button class="btn sm" data-act="propNova">+ Proposta</button></div></div>
   <div><div class="lab">Espaços do estúdio hoje</div><div class="floor">${ESPACOS.map(e=>`<div class="b ${occNow.has(e)?"on":occ.has(e)?"v":""}">${e}</div>`).join("")}</div>
   <div class="floorlg"><span><i style="background:var(--flash)"></i>no ar agora</span><span><i style="background:var(--volt)"></i>reservado hoje</span><span><i style="background:var(--card2);border:1px solid var(--linha)"></i>livre</span></div></div></div>
  <div class="stages">
   <div class="stage" data-act="goProp" data-v="abertas"><div class="h">${ic("doc")} Em negociação</div><div class="n">${neg.length}<small>${brl(soma(neg.map(p=>({valor:p.valor_fixo}))))}/mês</small></div></div>
   <div class="stage v" data-act="goProp" data-v="aceita"><div class="h">${ic("brand")} Contratos ativos</div><div class="n">${ativos.length}<small>${brl(soma(ativos.map(p=>({valor:p.valor_fixo}))))}/mês</small></div></div>
   <div class="stage" data-act="goJobs" data-v="proximos"><div class="h">${ic("live")} Lives no mês</div><div class="n">${livesMes.length}<small>${livesMes.filter(j=>j.status==="realizado").length} realizadas</small></div></div>
   <div class="stage c" data-act="goFin" data-v="lanc"><div class="h">${ic("wallet")} Caixa do mês</div><div class="n">${brl(soma(ent)-soma(sai))}<small>entrou ${brl(soma(ent))}</small></div></div>
  </div>
  <div class="sec"><h2>Próximas lives</h2><div class="row"><button class="btn sm" data-act="tab" data-v="jobs">Ver todas as lives ›</button></div></div>
  ${chips("painel",[["hoje","Hoje",cnt.hoje],["semana","7 dias",cnt.semana],["vagas","Vagas abertas",cnt.vagas],["todas","Todas futuras",cnt.todas]],st)}
  ${tbl(JCOLS,l.slice(0,12).map(jobRow),"Nenhuma live neste filtro.")}`;
};

VIEWS.agenda=()=>_agendaOld().replace(/<button class="btn p sm" data-act="novoJob">\+ Nova live<\/button>/,"");

function jobsFiltrados(){
  const f=S.f.jobs,now=new Date(),hoje=new Date(now.toDateString()),fimSem=new Date(hoje.getTime()+7*864e5);
  let l=S.jobs.filter(j=>has(f.q,j.marca,j.produto,jn(j.numero),cliNome(j.cliente_id),nome(j.principal_id),nome(j.substituto_id),j.espaco));
  if(f.cli)l=l.filter(j=>(j.marca||cliNome(j.cliente_id))===f.cli);
  if(f.sel)l=l.filter(j=>j.principal_id===f.sel||j.substituto_id===f.sel);
  if(f.loc)l=l.filter(j=>j.local_tipo===f.loc);
  if(f.mod)l=l.filter(j=>j.modalidade===f.mod);
  const g={proximos:l.filter(j=>j.status==="aberto"&&new Date(j.fim)>now),hoje:l.filter(j=>j.status!=="cancelado"&&sameDay(new Date(j.inicio),now)),semana:l.filter(j=>j.status!=="cancelado"&&new Date(j.fim)>now&&new Date(j.inicio)<fimSem),
    vagas:l.filter(j=>j.status==="aberto"&&new Date(j.inicio)>now&&!j.principal_id),fechar:l.filter(j=>j.status==="aberto"&&new Date(j.fim)<=now),realizados:l.filter(j=>j.status==="realizado").reverse(),cancelados:l.filter(j=>j.status==="cancelado").reverse(),todos:l};
  return g}
const LISTS={};
LISTS.jobs=()=>{const g=jobsFiltrados(),l=g[S.f.jobs.st]||g.proximos;
  return tbl(JCOLS,l.map(jobRow),"Nenhuma live neste filtro.")+`<div class="small muted" style="margin-top:8px">${l.length} lives · cachês ${brl(l.reduce((s,j)=>s+(Number(j.valor_seller)||0),0))}</div>`};
VIEWS.jobs=()=>{const g=jobsFiltrados(),f=S.f.jobs;
  const marcas=[...new Set(S.jobs.map(j=>j.marca||cliNome(j.cliente_id)).filter(Boolean))].sort();
  const sellers=S.membros.filter(m=>S.jobs.some(j=>j.principal_id===m.id||j.substituto_id===m.id));
  return chips("jobs",[["proximos","Próximas",g.proximos.length],["hoje","Hoje",g.hoje.length],["semana","7 dias",g.semana.length],["vagas","Vagas abertas",g.vagas.length],["fechar","A fechar",g.fechar.length],["realizados","Realizadas",g.realizados.length],["cancelados","Canceladas",g.cancelados.length],["todos","Todas",g.todos.length]],f.st)
   +`<div class="tool">${qbox("jobs","Buscar marca, produto, nº, seller…")}${fsel("jobs","cli","Todas as marcas",marcas.map(m=>[m,m]))}${fsel("jobs","sel","Todos os sellers",sellers.map(m=>[m.id,m.nome]))}${fsel("jobs","loc","Qualquer local",[["estudio","Estúdio"],["cliente","Local do cliente"],["online","Online"]])}${fsel("jobs","mod","Modalidade",[["servico","Serviço completo"],["aluguel","Só aluguel"]])}${(f.cli||f.sel||f.loc||f.mod||f.q)?`<button class="btn sm" data-act="flimpa" data-v="jobs">Limpar</button>`:""}</div>
   <div id="lst">${LISTS.jobs()}</div>`};

function propLista(){const f=S.f.prop;let l=S.propostas.filter(p=>has(f.q,p.marca,p.contrato_numero,pn(p.numero),p.pacote,p.produtos,cliNome(p.cliente_id)));if(f.pac)l=l.filter(p=>p.pacote===f.pac);return l}
function propSteps(p){const jobs=S.jobs.filter(j=>j.proposta_id===p.id);const fat=S.fin.some(x=>x.proposta_id===p.id&&x.tipo==="entrada"&&x.status==="ativo");

   <td data-l="1ª live">${p.primeira_live?dCurta(p.primeira_live):"—"}${p.contrato_fim?`<div class="s">até ${dCurta(p.contrato_fim)}</div>`:""}</td>

  +`<div class="tool">${qbox("prop","Buscar marca, nº, produto…")}${fsel("prop","pac","Todos os pacotes",PACOTES.map(p=>[p,p]))}</div><div id="lst">${LISTS.prop()}</div>`};

/* ---------- FINANCEIRO ---------- */
function finPeriodo(){const a=S.fin.filter(f=>f.status==="ativo");if(S.finMes==="tudo")return a;return a.filter(f=>{const d=f.pago_em||f.vencimento||(f.created_at||"").slice(0,10);return d&&d.slice(0,7)===S.finMes})}
function finFiltrar(l){const f=S.f.fin;l=l.filter(x=>has(f.q,x.descricao,x.contraparte,CAT_NOME[x.categoria],x.nf_numero,nome(x.reembolso_para)));
  if(f.cat)l=l.filter(x=>x.categoria===f.cat);if(f.pes)l=l.filter(x=>x.reembolso_para===f.pes);if(f.forma)l=l.filter(x=>x.forma===f.forma);return l}
function finRow(x){const pend=!x.pago_em,venc=x.vencimento&&parseYmd(x.vencimento)<new Date(new Date().toDateString());
  const st=x.reembolso!=="nao"?`<span class="tag ${x.reembolso==="pago"?"o":x.reembolso==="recusado"?"x":"w"}">reembolso ${x.reembolso}</span>${x.reembolso_para?`<div class="s">para ${esc(nome(x.reembolso_para))}</div>`:""}`:pend?`<span class="tag ${venc?"x":"w"}">${x.tipo==="entrada"?"a receber":"a pagar"}${venc?" · atrasado":""}</span>`:`<span class="tag o">${x.tipo==="entrada"?"recebido":"pago"}</span>`;
  return `<tr data-act="fin" data-id="${x.id}"><td data-l="Data">${dCurta(x.pago_em||x.vencimento||x.created_at)}</td><td class="m0"><div class="t">${esc(x.descricao||CAT_NOME[x.categoria]||x.categoria)}${x.tem_comprovante?" 📎":""}</div><div class="s">${esc(x.contraparte||"")}${x.forma?" · "+esc(x.forma):""}</div></td>
  <td data-l="Categoria">${esc(CAT_NOME[x.categoria]||x.categoria)}${x.natureza?`<div class="s">${x.natureza==="variavel"?"variável":x.natureza}</div>`:""}</td><td data-l="Situação">${st}</td><td data-l="Valor" class="r ${x.tipo==="entrada"?"pos":"neg"}">${x.tipo==="entrada"?"+":"−"} ${brl(x.valor)}</td></tr>`}
const FCOLS=[["Data"],["Descrição"],["Categoria"],["Situação"],["Valor","r"]];
LISTS.fin=()=>{const sub=S.finSub;let l;
  if(sub==="reemb")l=finFiltrar(S.fin.filter(x=>x.status==="ativo"&&x.reembolso!=="nao"));
  else{l=finFiltrar(finPeriodo());const t=S.f.fin.tipo;if(t==="entradas")l=l.filter(x=>x.tipo==="entrada");if(t==="saidas")l=l.filter(x=>x.tipo==="saida");if(t==="pendentes")l=l.filter(x=>!x.pago_em);if(t==="fixas")l=l.filter(x=>x.natureza==="fixa");if(t==="variaveis")l=l.filter(x=>x.natureza==="variavel")}
  l=l.slice().sort((a,b)=>(b.pago_em||b.vencimento||"")>(a.pago_em||a.vencimento||"")?1:-1);
  const tot=l.reduce((s,x)=>s+(x.tipo==="entrada"?1:-1)*(Number(x.valor)||0),0);
  return tbl(FCOLS,l.map(finRow),"Nenhum lançamento.")+`<div class="small muted" style="margin-top:8px">${l.length} lançamentos · saldo da lista ${brl(tot)}</div>`};
function finTool(){const usados=[...new Set(S.fin.map(x=>x.categoria))];const pess=S.membros.filter(m=>S.fin.some(x=>x.reembolso_para===m.id));
  return `<div class="tool">${qbox("fin","Buscar descrição, quem, NF…")}${fsel("fin","cat","Todas as categorias",usados.map(c=>[c,CAT_NOME[c]||c]))}${fsel("fin","pes","Qualquer pessoa",pess.map(m=>[m.id,m.nome]))}${fsel("fin","forma","Qualquer forma",["Pix","Boleto","Cartão","Transferência","Dinheiro"].map(x=>[x,x]))}</div>`}
VIEWS.fin=()=>{const sub=S.finSub;
  const fxA=fxAlertas().filter(x=>x.s.k==="atrasado").length,exP=extPend().length;
  const subs=chips("finSub",[["lanc","Lançamentos"],["fixas","Despesas fixas",fxA||undefined],["fluxo","Fluxo de caixa"],["extrato","Extrato do banco",exP||undefined],["reemb","Reembolsos",S.fin.filter(x=>x.status==="ativo"&&["solicitado","aprovado"].includes(x.reembolso)).length],["cat","Por categoria"],...(isSocio()?[["aporte","Aporte"]]:[])],sub);
  if(sub==="fixas")return subs+fxView();if(sub==="fluxo")return subs+flView();if(sub==="extrato")return subs+exView();
  const ativos=S.fin.filter(x=>x.status==="ativo");
  if(sub==="aporte"){const a=aporteInfo();
    return subs+`<div class="grid kpis"><div class="card kpi vol"><div class="l">Aportado</div><div class="n">${brl(a.tot)}</div></div><div class="card kpi"><div class="l">Devolvido</div><div class="n">${brl(a.dv)}</div></div><div class="card kpi cob"><div class="l">Saldo a devolver</div><div class="n">${brl(a.saldo)}</div></div><div class="card kpi"><div class="l">Estimado no acordo</div><div class="n">R$ 300.000</div></div></div>
    <div class="hint" style="margin:10px 0">Pelo acordo de sócios, cada aporte é devolvido em até 18 meses do desembolso, com correção monetária (sem juros), antes de qualquer distribuição de lucros. A correção não é calculada aqui.</div>
    <div class="tblw"><table class="tb"><thead><tr><th>Data</th><th class="r">Valor</th><th>Devolver até</th><th>Faltam</th></tr></thead><tbody>${a.ap.sort((x,y)=>x.pago_em<y.pago_em?-1:1).map(x=>{const d=parseYmd(x.pago_em);d.setMonth(d.getMonth()+18);const dias=Math.ceil((d-new Date())/864e5);return `<tr data-act="fin" data-id="${x.id}"><td data-l="Data">${dCurta(x.pago_em)} ${x.pago_em.slice(0,4)}</td><td data-l="Valor" class="r">${brl(x.valor)}</td><td data-l="Até">${dCurta(d)} ${d.getFullYear()}</td><td data-l="Faltam">${dias} dias</td></tr>`}).join("")||`<tr><td colspan="4" class="muted">Nenhum aporte registrado.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn p sm" data-act="finNovo" data-tipo="entrada" data-cat="aporte">+ Registrar aporte</button><button class="btn sm" data-act="finNovo" data-tipo="saida" data-cat="devolucao_aporte">+ Registrar devolução</button></div>`}
  if(sub==="reemb"){const l=ativos.filter(x=>x.reembolso!=="nao");const pess={};
    l.filter(x=>["solicitado","aprovado"].includes(x.reembolso)).forEach(x=>{const k=x.reembolso_para||"?";pess[k]=pess[k]||{sol:0,apr:0,n:0};pess[k][x.reembolso==="aprovado"?"apr":"sol"]+=Number(x.valor)||0;pess[k].n++});
    return subs+`<div class="grid kpis" style="margin-bottom:14px">${Object.entries(pess).map(([k,v])=>`<div class="card kpi ${k===S.me.id?"vol":""}"><div class="l">A devolver · ${esc(nome(k)||"sem nome")}</div><div class="n">${brl(v.sol+v.apr)}</div><div class="small" style="margin-top:4px">${v.n} itens · aprovado ${brl(v.apr)}</div></div>`).join("")}<div class="card kpi"><div class="l">Já reembolsado</div><div class="n">${brl(soma(l.filter(x=>x.reembolso==="pago")))}</div></div></div>`+finTool()+`<div id="lst">${LISTS.fin()}</div>`}
  const [y,m]=S.finMes==="tudo"?[0,0]:S.finMes.split("-").map(Number);
  const per=finPeriodo(),ent=per.filter(x=>x.tipo==="entrada"),sai=per.filter(x=>x.tipo==="saida");
  const nav=`<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="finMes" data-v="-1">‹</button><b style="min-width:120px;text-align:center">${S.finMes==="tudo"?"Todo o período":ML[m-1]+" "+y}</b><button class="btn sm" data-act="finMes" data-v="1">›</button>${S.finMes==="tudo"?`<button class="btn sm" data-act="finMes" data-v="0">Este mês</button>`:`<button class="btn sm" data-act="finMes" data-v="tudo">Tudo</button>`}</div>`;
  const kp=`<div class="grid kpis" style="margin-bottom:14px"><div class="card kpi"><div class="l">Entrou</div><div class="n pos">${brl(soma(ent.filter(x=>x.pago_em)))}</div></div><div class="card kpi"><div class="l">Saiu</div><div class="n neg">${brl(soma(sai.filter(x=>x.pago_em)))}</div></div><div class="card kpi cob"><div class="l">A receber</div><div class="n">${brl(soma(ent.filter(x=>!x.pago_em)))}</div></div><div class="card kpi"><div class="l">A pagar</div><div class="n">${brl(soma(sai.filter(x=>!x.pago_em)))}</div></div></div>`;
  if(sub==="cat"){const g={};sai.forEach(x=>{g[x.categoria]=(g[x.categoria]||0)+(Number(x.valor)||0)});const arr=Object.entries(g).sort((a,b)=>b[1]-a[1]);const mx=arr.length?arr[0][1]:1;
    return subs+nav+kp+`<div class="panel"><h3>Saídas por categoria <span class="muted small" style="font-family:Figtree,system-ui,sans-serif">fixas ${brl(soma(sai.filter(x=>x.natureza==="fixa")))} · variáveis ${brl(soma(sai.filter(x=>x.natureza==="variavel")))}</span></h3><div class="bars">${arr.map(([c,v])=>`<div class="bl"><span>${esc(CAT_NOME[c]||c)}</span><span class="bt"><i style="width:${Math.max(2,v/mx*100)}%"></i></span><span>${brl(v)}</span></div>`).join("")||`<div class="muted small">Sem saídas no período.</div>`}</div></div>`}
  const t=S.f.fin.tipo,c=k=>({tudo:per.length,entradas:ent.length,saidas:sai.length,pendentes:per.filter(x=>!x.pago_em).length,fixas:sai.filter(x=>x.natureza==="fixa").length,variaveis:sai.filter(x=>x.natureza==="variavel").length})[k];
  return subs+nav+kp+chips("finTipo",[["tudo","Tudo",c("tudo")],["entradas","Entradas",c("entradas")],["saidas","Saídas",c("saidas")],["pendentes","Pendentes",c("pendentes")],["fixas","Fixas",c("fixas")],["variaveis","Variáveis",c("variaveis")]],t)+finTool()+`<div id="lst">${LISTS.fin()}</div>`;
};

  if(f.v==="saldo"){const s={};at.forEach(a=>{const k=(a.marca||"")+"|"+a.produto;s[k]=s[k]||{marca:a.marca,produto:a.produto,ent:0,sai:0,ult:a.data};s[k][a.movimento==="entrada"?"ent":"sai"]+=a.qtd;if(a.data>s[k].ult)s[k].ult=a.data});

  return chips("amV",[["saldo","Estoque"],["mov","Movimentos",S.amostras.filter(a=>a.status!=="cancelado").length]],f.v)+`<div class="tool">${qbox("am","Buscar produto, marca, influencer…")}${fsel("am","marca","Todas as marcas",marcas.map(m=>[m,m]))}</div><div id="lst">${LISTS.am()}</div>`};

LISTS.eq=()=>{const f=S.f.eq;let l=eqLista();if(f.st!=="inativos")l=l.filter(m=>m.status!=="inativo");
  if(f.st==="socios")l=l.filter(m=>m.papel==="socio");if(f.st==="equipe")l=l.filter(m=>m.papel==="basico");if(f.st==="sellers")l=l.filter(m=>m.papel==="seller"&&m.status==="ativo");if(f.st==="pendentes")l=l.filter(m=>m.status==="pendente");if(f.st==="inativos")l=l.filter(m=>m.status==="inativo");

   <td data-l="Termo">${kycTag(m)}${m.papel!=="seller"?"—":m.termo_aceito_em?`<span class="tag o">aceito</span>`:`<span class="tag x">pendente</span>`}</td><td data-l="Lives" class="r">${js.length}</td></tr>`}),"Ninguém neste filtro.")};

/* ---------- busca global ---------- */
function gsearch(q){q=q.trim();const box=$("#gres");if(!q){box.hidden=true;return}
  const r=[];
  S.jobs.filter(j=>has(q,j.marca,j.produto,jn(j.numero),nome(j.principal_id))).slice(0,5).forEach(j=>r.push(["Live",`${esc(j.marca||"")} · ${jn(j.numero)}`,dCurta(j.inicio)+" "+hm(j.inicio),"job",j.id]));
  S.propostas.filter(p=>has(q,p.marca,p.contrato_numero,pn(p.numero))).slice(0,4).forEach(p=>r.push(["Proposta",esc(p.marca)+" · "+(p.contrato_numero||pn(p.numero)),PST[p.status][0],"prop",p.id]));
  S.clientes.filter(c=>has(q,c.marca,c.empresa,c.cnpj)).slice(0,4).forEach(c=>r.push(["Cliente",esc(c.marca),esc(c.empresa||""),"cli",c.id]));
  S.membros.filter(m=>has(q,m.nome,m.email)).slice(0,4).forEach(m=>r.push(["Pessoa",esc(m.nome),esc(m.email),"membro",m.id]));
  S.fin.filter(x=>x.status==="ativo"&&has(q,x.descricao,x.contraparte)).slice(0,5).forEach(x=>r.push(["Financeiro",esc(x.descricao||CAT_NOME[x.categoria]),brl(x.valor),"fin",x.id]));
  box.innerHTML=r.length?r.map(x=>`<button data-act="${x[3]}" data-id="${x[4]}"><span class="k">${x[0]}</span><span><b>${x[1]}</b><br><span class="muted small">${x[2]}</span></span></button>`).join(""):`<div class="muted small" style="padding:10px">Nada encontrado.</div>`;box.hidden=false}

function csvDownload(name,rows){const csv="﻿"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(";")).join("\n");const u=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="gq"){gsearch(t.value);return}
  if(t.dataset.q){S.f[t.dataset.q].q=t.value;const L={jobs:"jobs",prop:"prop",cli:"cli",fin:"fin",am:"am",eq:"eq"}[t.dataset.q];if(L&&$("#lst"))$("#lst").innerHTML=LISTS[L]()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.fsel){const[k,f]=t.dataset.fsel.split(".");S.f[k][f]=t.value;render()}});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch")&&$("#gres"))$("#gres").hidden=true;
  const a=e.target.closest("[data-act]");if(!a)return;const v=a.dataset.v;
  switch(a.dataset.act){
    case"fchip":{const k=a.dataset.f;if(k==="finSub")S.finSub=v;else if(k==="finTipo")S.f.fin.tipo=v;else if(k==="amV")S.f.am.v=v;else if(k==="rpTab"){S.rp.tab=v;if(v==="autonomia"&&!S.ev)loadEv()}else if(k==="ctr")S.f.ctr.tipo=v;else S.f[k].st=v;render();break}
    case"flimpa":Object.assign(S.f[v],{q:"",cli:"",sel:"",loc:"",mod:""});render();break;
    case"goJobs":S.tab="jobs";S.f.jobs.st=v;render();break;
    case"goProp":S.tab="propostas";S.f.prop.st=v;render();break;
    case"goFin":S.tab="fin";S.finSub=v==="reemb"?"reemb":"lanc";render();break;
    case"goEq":S.tab="equipe";S.f.eq.st=v;render();break;
    case"csvList":if(v==="jobs"){const g=jobsFiltrados()[S.f.jobs.st];csvDownload("implay_jobs.csv",[["Nº","Marca","Produto","Início","Fim","Local","Espaço","Principal","Substituto","Cachê","Quem paga","Status"],...g.map(j=>[jn(j.numero),j.marca,j.produto,new Date(j.inicio).toLocaleString("pt-BR"),new Date(j.fim).toLocaleString("pt-BR"),j.local_tipo,j.espaco,nome(j.principal_id),nome(j.substituto_id),j.valor_seller,j.seller_pago_por,j.status])])}
      else{const l=S.finSub==="reemb"?finFiltrar(S.fin.filter(x=>x.status==="ativo"&&x.reembolso!=="nao")):finFiltrar(finPeriodo());csvDownload("implay_financeiro.csv",[["Data","Tipo","Categoria","Natureza","Descrição","Contraparte","Valor","Pago em","Vencimento","Forma","NF","Pago por","Reembolso","Reembolso para"],...l.map(x=>[x.pago_em||x.vencimento,x.tipo,CAT_NOME[x.categoria]||x.categoria,x.natureza,x.descricao,x.contraparte,String(x.valor).replace(".",","),x.pago_em,x.vencimento,x.forma,x.nf_numero,x.pago_por,x.reembolso,nome(x.reembolso_para)])])}break;
  }
},true);

/* ---------- utilidades de período ---------- */
function rangeOf(per){const n=new Date();let a,b=new Date(n.getFullYear(),n.getMonth()+1,1);
  if(per==="mes")a=new Date(n.getFullYear(),n.getMonth(),1);
  else if(per==="mesant"){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),1)}
  else if(per==="tri")a=new Date(n.getFullYear(),n.getMonth()-2,1);
  else if(per==="ano")a=new Date(n.getFullYear(),0,1);
  else a=new Date(2000,0,1);return [a,b]}
const PER_LAB={mes:"Este mês",mesant:"Mês passado",tri:"Últimos 3 meses",ano:"Este ano",tudo:"Tudo"};
function inR(d,[a,b]){if(!d)return false;d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return d>=a&&d<b}
function hrs(j){return Math.max(0,(new Date(j.fim_real||j.fim)-new Date(j.inicio_real||j.inicio))/36e5)}
function nf(n,d=0){return (Number(n)||0).toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:d})}
function brlK(v){v=Number(v)||0;return Math.abs(v)>=1e6?"R$ "+nf(v/1e6,1)+" mi":Math.abs(v)>=1e4?"R$ "+nf(v/1e3,1)+" mil":brl(v)}
function bars(arr,fmt=brl,color){const mx=Math.max(1,...arr.map(x=>Math.abs(x[1])));return `<div class="bars">${arr.map(([l,v,sub])=>`<div class="bl"><span title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${Math.max(2,Math.abs(v)/mx*100)}%;${color?"background:"+color:""}"></i></span><span>${fmt(v)}${sub?`<small class="muted" style="display:block;font-weight:500">${sub}</small>`:""}</span></div>`).join("")||`<div class="muted small">Sem dados no período.</div>`}</div>`}
function colsChart(arr,fmt=brlK){const mx=Math.max(1,...arr.map(x=>Math.max(Math.abs(x[1]),Math.abs(x[2]||0))));
  return `<div class="cchart">${arr.map(([l,v,v2])=>`<div class="cc"><div class="ccb"><i class="a" style="height:${Math.abs(v)/mx*100}%" title="${fmt(v)}"></i>${v2!==undefined?`<i class="b" style="height:${Math.abs(v2)/mx*100}%" title="${fmt(v2)}"></i>`:""}</div><div class="ccl">${esc(l)}</div><div class="ccv">${fmt(v)}</div></div>`).join("")}</div>`}
function mini(l,v,sub,cls=""){return `<div class="mk ${cls}"><div class="l">${l}</div><div class="n">${v}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`}
function lastMonths(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push([monthKey(x),MS[x.getMonth()]])}return out}

/* ---------- etapas do negócio ---------- */
const FUNIL=[["lead","Lead / rascunho","Primeiro contato, proposta em montagem"],["enviada","Proposta enviada","Aguardando retorno da marca"],["contrato","Contrato fechado","Aceita, antes da 1ª live"],["operacao","Em operação","Lives acontecendo"],["renovar","Renovar","Contrato vence em até 30 dias"],["encerrado","Encerrado / perdido","Recusada, cancelada ou vencida"]];
function etapaProp(p){const hoje=new Date(new Date().toDateString());
  if(["recusada","cancelada"].includes(p.status))return "encerrado";
  if(p.status==="rascunho")return "lead";if(p.status==="enviada")return "enviada";
  const fim=p.contrato_fim?parseYmd(p.contrato_fim):null;if(fim&&fim<hoje)return "encerrado";
  if(fim&&(fim-hoje)/864e5<=30)return "renovar";
  const js=S.jobs.filter(j=>j.proposta_id===p.id&&j.status!=="cancelado");if(js.some(j=>new Date(j.inicio)<=new Date()))return "operacao";return "contrato"}
VIEWS.funil=()=>{const g={};FUNIL.forEach(f=>g[f[0]]=[]);S.propostas.forEach(p=>g[etapaProp(p)].push(p));
  const tot=k=>soma(g[k].map(p=>({valor:p.valor_fixo})));
  const conv=S.propostas.filter(p=>p.status!=="rascunho").length?Math.round(S.propostas.filter(p=>p.status==="aceita").length/S.propostas.filter(p=>p.status!=="rascunho").length*100):0;
  return `<div class="mks">${mini("Propostas no funil",S.propostas.filter(p=>["rascunho","enviada"].includes(p.status)).length)}${mini("Valor em negociação",brlK(tot("lead")+tot("enviada"))+"/mês")}${mini("Contratos ativos",g.contrato.length+g.operacao.length+g.renovar.length,"","v")}${mini("Receita fixa contratada",brlK(tot("contrato")+tot("operacao")+tot("renovar"))+"/mês")}${mini("Taxa de conversão",conv+"%","aceitas ÷ enviadas")}${mini("Para renovar",g.renovar.length,"vencem em 30 dias",g.renovar.length?"f":"")}</div>
  <div class="kanban">${FUNIL.map(([k,l,d])=>`<div class="kcol"><div class="kh"><b>${l}</b><span>${g[k].length}</span></div><div class="kd">${d}</div>
   ${g[k].map(p=>`<div class="kc" data-act="prop" data-id="${p.id}"><div class="t">${esc(p.marca)}</div><div class="s">${esc(p.pacote||"")}${p.valor_fixo?" · "+brlK(p.valor_fixo)+"/mês":""}</div><div class="s">${p.contrato_numero?esc(p.contrato_numero):pn(p.numero)}${p.contrato_fim?" · até "+dCurta(p.contrato_fim):p.primeira_live?" · 1ª live "+dCurta(p.primeira_live):""}</div></div>`).join("")||`<div class="kempty">—</div>`}
   <div class="kt">${brlK(tot(k))}/mês</div></div>`).join("")}</div>
  <div class="sec"><h2>Etapas de cada live</h2></div>
  <div class="steps8">${[["1","Proposta","Marca, pacote, valores e % gerados no padrão Implay"],["2","Contrato","Gerado do sistema e assinado pela marca"],["3","Live publicada","Data, horário, espaço, cachê no mural"],["4","Seller escolhe","Principal e substituto pelo app, com histórico"],["5","Live no ar","Início e fim reais, GMV e pedidos"],["6","Fatura","Fixo + % sobre vendas; seller fatura direto"],["7","Recebido","Baixa no financeiro"],["8","Relatório","Vendas, ranking e resultado"]].map(([n,t,d])=>`<div class="s8"><b>${n}</b><div class="t">${t}</div><div class="d">${d}</div></div>`).join("")}</div>`};

function orcTemDesc(o){return (o.itens||[]).some(itemDesc)}
function orcResumo(o){const g={hora:[],pontual:[],pacote:[],drop:[],cx:[],gestao:[]};(o.itens||[]).filter(i=>i.on).forEach(i=>{const p=i.p||preco(i.k);if(!p)return;if(String(i.k).startsWith("cx:"))g.cx.push(p.nome||"Sob medida");else if(g[p.grupo])g[p.grupo].push(p.categoria)});
  return [g.hora.length?"Por hora de live":"",...g.cx,g.pontual.length?"Pontual "+g.pontual.join("/"):"",g.pacote.length?"Pacote "+g.pacote.join("/"):"",g.drop.length?"Live Drop":"",...g.gestao].filter(Boolean).join(" · ")||"—"}
function orcValorTxt(o){const it=(o.itens||[]).filter(i=>i.on);const hr=it.find(i=>(preco(i.k)||{}).grupo==="hora");if(hr){const h=hrDe(hr,preco(hr.k));return brl(h.vh)+"/hora · "+brl(h.mensal)+"/mês"}const pk=it.filter(i=>(preco(i.k)||{}).grupo==="pacote");
  if(pk.length)return brl(Math.min(...pk.map(i=>Number(i.valor))))+(pk.length>1?" a "+brl(Math.max(...pk.map(i=>Number(i.valor)))):"")+"/mês";
  const pt=it.filter(i=>(preco(i.k)||{}).grupo==="pontual");if(pt.length)return "a partir de "+brl(Math.min(...pt.map(i=>Number(i.valor))));

async function docDetectar(file){const nome=file.name;let txt="";
  if(/pdf/.test(file.type)||/\.pdf$/i.test(nome))txt=await pdfTexto(file);
  const alvo=(txt.slice(0,4000)+" "+nome.replace(/[_-]+/g," "));let titulo=null,cat="outro";
  for(const [re,t,c] of DOC_REGRAS){if(re.test(alvo)){titulo=t;cat=c;break}}
  if(!titulo&&!txt.trim()){if(/cnpj/i.test(nome)){titulo="Cartão CNPJ";cat="fiscal"}else if(/acordo|s[oó]cios/i.test(nome)){titulo="Acordo de sócios";cat="societario"}}
  if(!titulo)return {titulo:nomeLimpo(nome),categoria:cat};
  const v=nome.match(/(?:^|[^a-z])V\s?(\d{1,3})(?!\d)/i);if(v&&/Acordo|Contrato/.test(titulo))titulo+=" (V"+v[1]+")";
  if(/assinad|docusign|clicksign/i.test(alvo)&&/Contrato|Acordo|Alteração|Procuração/.test(titulo))titulo+=" assinado";

const FREQ=[["mensal","Mensal",1],["bimestral","A cada 2 meses",2],["trimestral","A cada 3 meses",3],["semestral","A cada 6 meses",6],["anual","Anual",12]];
const FX_MODELOS=[["Aluguel","aluguel_imovel",0],["Condomínio","condominio_iptu",0],["IPTU","condominio_iptu",0],["Luz","contas",1],["Água","contas",1],["Internet","contas",0],["Telefone","contas",0],["Contador","contador",0],["Limpeza","limpeza",0],["Seguro","seguro",0],["Software / assinatura","outra_saida",0]];

const hoje0=()=>new Date(new Date().toDateString());
const mesLab=c=>{const d=parseYmd(c);return ML[d.getMonth()]+" "+d.getFullYear()};
const mesCurto=c=>{const d=parseYmd(c);return MS[d.getMonth()]+"/"+String(d.getFullYear()).slice(2)};
const ddmm=d=>{d=typeof d==="string"?parseYmd(d):d;return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
const diasEntre=(a,b)=>Math.round((b-a)/864e5);
const fxPasso=f=>(FREQ.find(x=>x[0]===f.frequencia)||FREQ[0])[2];
function fxVenc(f,comp){const c=parseYmd(comp);const last=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();return new Date(c.getFullYear(),c.getMonth(),Math.min(f.dia_venc||10,last))}
function fxComps(f,a,b){const out=[];if(!f.inicio)return out;const ini=parseYmd(f.inicio),st=fxPasso(f),fim=f.fim?parseYmd(f.fim):null;let c=new Date(ini.getFullYear(),ini.getMonth(),1);
  let g=0;while(c<a&&g++<600)c=new Date(c.getFullYear(),c.getMonth()+st,1);while(c<=b&&g++<1200){if(fim&&c>fim)break;out.push(ymd(c));c=new Date(c.getFullYear(),c.getMonth()+st,1)}return out}
function fxPag(f,comp){return S.fin.find(x=>x.status!=="cancelado"&&x.fixa_id===f.id&&String(x.competencia||"").slice(0,10)===comp)}
function fxSt(f,comp){const p=fxPag(f,comp),v=fxVenc(f,comp),h=hoje0(),d=diasEntre(h,v);
  if(p&&p.pago_em)return {k:"pago",p,v,dif:(Number(p.valor)||0)-(Number(f.valor_previsto)||0)};
  if(d<0)return {k:"atrasado",p,v,d:-d};
  if(d<=(f.aviso_dias??3))return {k:"vence",p,v,d};
  return {k:p?"lancado":"previsto",p,v,d}}
function fxTag(s){return s.k==="pago"?`<span class="tag o">pago ${ddmm(s.p.pago_em)}</span>`:s.k==="atrasado"?`<span class="tag x">sem confirmação de pagamento · venceu há ${s.d} ${s.d===1?"dia":"dias"}</span>`:s.k==="vence"?`<span class="tag w">${s.d===0?"vence hoje":"vence em "+s.d+(s.d===1?" dia":" dias")}</span>`:s.k==="lancado"?`<span class="tag c">lançado, a pagar</span>`:`<span class="tag">previsto</span>`}
function fxDif(s,f){if(s.k!=="pago")return "";const d=s.dif,pr=Number(f.valor_previsto)||0;if(Math.abs(d)<0.005)return `<span class="muted">igual</span>`;const pc=pr?Math.round(d/pr*100):0;return `<span class="${d>0?"neg":"pos"}">${d>0?"+":"−"} ${brl(Math.abs(d))}${pc?` (${d>0?"+":""}${pc}%)`:""}</span>`}
function fxAlertas(){const h=hoje0(),a=new Date(h.getFullYear(),h.getMonth()-3,1),b=new Date(h.getFullYear(),h.getMonth()+1,1),out=[];
  (S.fixas||[]).filter(f=>f.ativo!==false).forEach(f=>fxComps(f,a,b).forEach(c=>{const s=fxSt(f,c);if(s.k==="atrasado"||s.k==="vence")out.push({f,c,s})}));return out.sort((x,y)=>x.s.v-y.s.v)}

   <td data-l="Vencimento">${ddmm(s.v)}</td><td data-l="Previsto" class="r">${brl(f.valor_previsto)}</td><td data-l="Pago" class="r">${s.k==="pago"?`<b>${brl(s.p.valor)}</b>`:"—"}</td><td data-l="Diferença" class="r">${fxDif(s,f)||"—"}</td><td data-l="Situação">${fxTag(s)}</td>

      if(s.k==="atrasado")return `<td class="r"><span class="hc hx" data-act="fxPagar" data-v="${f.id}|${c}">sem conf.</span></td>`;return `<td class="r muted small">${s.k==="vence"?"a vencer":"previsto"}</td>`}).join("");
    return `<tr data-act="fxEdit" data-id="${f.id}"><td class="m0"><div class="t">${esc(f.nome)}</div><div class="s">prev. ${brl(f.valor_previsto)}${f.ativo===false?" · desativada":""}</div></td>${cel}<td class="r" data-l="Média">${pg.length?brl(pg.reduce((a,b)=>a+b,0)/pg.length):"—"}</td></tr>`}).join("")}</tbody></table></div>`:"";
  const cad=`<div class="sec"><h2>Cadastro das despesas fixas</h2><span class="muted small">${ativos.length} ativas · total mensal ≈ ${brl(ativos.reduce((t,f)=>t+(Number(f.valor_previsto)||0)/fxPasso(f),0))}</span></div>`+tbl([["Despesa"],["Categoria"],["Previsto","r"],["Vence"],["Repete"],["No extrato aparece como"]],fxLista().map(f=>`<tr data-act="fxEdit" data-id="${f.id}" style="${f.ativo===false?"opacity:.5":""}"><td class="m0"><div class="t">${esc(f.nome)}</div><div class="s">${esc(f.contraparte||"")}</div></td><td data-l="Categoria">${esc(CAT_NOME[f.categoria]||f.categoria)}</td><td data-l="Previsto" class="r">${brl(f.valor_previsto)}${f.valor_varia?`<div class="s">varia</div>`:""}</td><td data-l="Vence">dia ${f.dia_venc}</td><td data-l="Repete">${(FREQ.find(x=>x[0]===f.frequencia)||FREQ[0])[1]}</td><td data-l="Extrato">${f.palavra_extrato?`<code>${esc(f.palavra_extrato)}</code>`:`<span class="muted small">—</span>`}</td></tr>`),"—");
  return nav+kp+tab+hist+cad}

    <div class="tblw"><table class="tb"><thead><tr><th>Mês</th><th>Venc.</th><th class="r">Previsto</th><th class="r">Pago</th><th>Pago em</th><th class="r">Diferença</th></tr></thead><tbody>${rows.slice().reverse().map(({c,s})=>`<tr ${s.k==="pago"?`data-act="fin" data-id="${s.p.id}"`:`data-act="fxPagar" data-v="${f.id}|${c}"`}><td style="text-transform:capitalize">${mesLab(c)}</td><td>${ddmm(s.v)}</td><td class="r">${brl(f.valor_previsto)}</td><td class="r">${s.k==="pago"?brl(s.p.valor):"—"}</td><td>${s.k==="pago"?ddmm(s.p.pago_em):fxTag(s)}</td><td class="r">${fxDif(s,f)||"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">Sem meses ainda.</td></tr>`}</tbody></table></div>`}

   ${fld("nome","Nome da despesa",f.nome,"text",'required placeholder="ex.: Luz do estúdio"')}
   <div class="fld"><label>Categoria</label><select name="categoria">${CAT_SAI.map(c=>`<option value="${c[0]}" ${c[0]===f.categoria?"selected":""}>${esc(c[1])}</option>`).join("")}</select></div>
   <div class="cols2">${moneyFld("valor_previsto","Valor previsto (R$)",f.valor_previsto)}<div class="fld"><label>O valor</label>${seg("valor_varia",[["0","É sempre o mesmo"],["1","Muda todo mês (consumo)"]],f.valor_varia?"1":"0")}</div></div>
   ${pick("dia_venc","Dia do vencimento",f.dia_venc,[5,10,15,20,25],{num:1,ph:"Outro dia: 1 a 31"})}

async function fxSalvar(id){const f=formData();if(!f.nome)return toast("Dê um nome",true);const v=num(f.valor_previsto);if(!v)return toast("Informe o valor previsto",true);
  const dia=parseInt(f.dia_venc);if(!(dia>=1&&dia<=31))return toast("Dia do vencimento entre 1 e 31",true);
  const row={nome:f.nome,categoria:f.categoria,valor_previsto:v,valor_varia:f.valor_varia==="1",dia_venc:dia,frequencia:f.frequencia||"mensal",inicio:(f.inicio||monthKey(new Date()))+"-01",fim:f.fim?f.fim+"-01":null,
    contraparte:f.contraparte||null,forma:f.forma||null,palavra_extrato:f.palavra_extrato?f.palavra_extrato.toUpperCase():null,aviso_dias:parseInt(f.aviso_dias)||3,obs:f.obs||null,updated_at:new Date().toISOString()};
  if(id)row.ativo=f.ativo!=="0";
  await run(id?db.from("imp_fixas").update(row).eq("id",id):db.from("imp_fixas").insert(row),"Salvo");closeSheet();await refresh()}
function fxPagar(fid,comp,ext){const f=S.fixas.find(x=>x.id===fid);if(!f)return;const p=fxPag(f,comp);if(p&&!ext)return openFin(p.id);
  openFin(null,{tipo:"saida",categoria:f.categoria,natureza:"fixa",valor:ext?Math.abs(ext.valor):f.valor_previsto,descricao:f.nome+" · "+mesLab(comp),contraparte:f.contraparte,vencimento:ymd(fxVenc(f,comp)),pago_em:ext?ext.data:ymd(new Date()),forma:f.forma,fixa_id:f.id,competencia:comp,extrato_id:ext?ext.id:null,_prev:f.valor_previsto})}

/* ---------- tela: fluxo de caixa ---------- */
const FL_HOR=[["30","30 dias"],["60","60 dias"],["90","90 dias"],["180","6 meses"],["365","12 meses"]];
function caixaReal(){// movimentos já realizados (dinheiro da empresa)
  return S.fin.filter(x=>x.status==="ativo"&&x.pago_em&&x.categoria!=="__").map(x=>{let v=0;if(x.tipo==="entrada")v=+x.valor;else if(x.pago_por!=="proprio")v=-x.valor;else if(x.reembolso==="pago")v=-x.valor;return {d:x.pago_em,v:Number(v)||0}}).filter(x=>x.v)}
function saldoHoje(){const h=ymd(new Date());const mov=caixaReal();const sb=(S.saldos||[]).slice().sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(a.created_at<b.created_at?1:-1))[0];
  if(sb){const v=Number(sb.valor)+mov.filter(m=>m.d>sb.data&&m.d<=h).reduce((t,m)=>t+m.v,0);return {v,base:sb}}
  return {v:mov.filter(m=>m.d<=h).reduce((t,m)=>t+m.v,0),base:null}}
function flItens(dias){const h=hoje0(),lim=new Date(+h+dias*864e5),it=[];const H=ymd(h);
  S.fin.filter(x=>x.status==="ativo"&&!x.pago_em&&!(x.tipo==="saida"&&x.pago_por==="proprio")).forEach(x=>{const d=x.vencimento?parseYmd(x.vencimento):h;if(d>lim)return;const atr=d<h;
    it.push({d:atr?h:d,atr,dt:x.vencimento,desc:x.descricao||CAT_NOME[x.categoria]||x.categoria,orig:x.fixa_id?"fixa":"lançamento",v:(x.tipo==="entrada"?1:-1)*(Number(x.valor)||0),act:"fin",id:x.id})});
  S.fin.filter(x=>x.status==="ativo"&&x.pago_por==="proprio"&&["solicitado","aprovado"].includes(x.reembolso)).forEach(x=>it.push({d:h,atr:false,desc:"Reembolso a "+(nome(x.reembolso_para)||"sócio")+" · "+(x.descricao||CAT_NOME[x.categoria]||""),orig:"reembolso",v:-(Number(x.valor)||0),act:"fin",id:x.id}));
  const a=new Date(h.getFullYear(),h.getMonth()-3,1);(S.fixas||[]).filter(f=>f.ativo!==false).forEach(f=>fxComps(f,a,lim).forEach(c=>{if(fxPag(f,c))return;const v=fxVenc(f,c);if(v>lim)return;const atr=v<h;it.push({d:atr?h:v,atr,dt:ymd(v),desc:f.nome+" · "+mesCurto(c),orig:"fixa",v:-(Number(f.valor_previsto)||0),act:"fxPagar",val:f.id+"|"+c})}));
  S.jobs.filter(j=>j.status==="aberto"&&j.seller_pago_por==="implay"&&Number(j.valor_seller)>0&&new Date(j.inicio)>=h&&new Date(j.inicio)<=lim&&!S.fin.some(x=>x.status==="ativo"&&x.job_id===j.id&&x.categoria==="seller")).forEach(j=>{const d=new Date(j.inicio);it.push({d:new Date(d.toDateString()),atr:false,desc:"Cachê seller · "+jn(j.numero)+" "+(j.marca||""),orig:"cachê",v:-(Number(j.valor_seller)||0),act:"job",id:j.id})});
  return it.sort((x,y)=>x.d-y.d||(y.v-x.v))}
function flChart(pts){if(pts.length<2)return "";const W=640,Hh=150,P=6;const xs=pts.map(p=>+p.d),ys=pts.map(p=>p.s);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys)||1;
  const X=t=>P+(W-2*P)*(x1===x0?0:(t-x0)/(x1-x0)),Y=v=>P+(Hh-2*P)*(1-(v-y0)/((y1-y0)||1));
  let dpath="";pts.forEach((p,i)=>{dpath+=(i?" H"+X(+p.d).toFixed(1)+" V":"M"+X(+p.d).toFixed(1)+" ")+Y(p.s).toFixed(1)});
  const ticks=[];const d=new Date(x0);d.setDate(1);d.setMonth(d.getMonth()+1);while(+d<=x1){ticks.push(new Date(d));d.setMonth(d.getMonth()+1)}
  return `<svg viewBox="0 0 ${W} ${Hh+16}" style="width:100%;height:auto;display:block"><line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 4"/>${ticks.map(t=>`<line x1="${X(+t)}" x2="${X(+t)}" y1="${P}" y2="${Hh-P}" stroke="currentColor" stroke-opacity=".08"/><text x="${X(+t)+3}" y="${Hh+12}" font-size="10" fill="currentColor" fill-opacity=".55">${MS[t.getMonth()]}</text>`).join("")}
   <path d="${dpath}" fill="none" stroke="var(--volt)" stroke-width="2.2"/><text x="${P+2}" y="${P+10}" font-size="10" fill="currentColor" fill-opacity=".6">${brlK(y1)}</text>${y0<0?`<text x="${P+2}" y="${Hh-P-2}" font-size="10" fill="#ff8a96">${brlK(y0)}</text>`:""}<text x="${W-P-2}" y="${Y(0)-3}" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".45">R$ 0</text>${ys.some(v=>v<0)?`<rect x="${P}" y="${Y(0)}" width="${W-2*P}" height="${Math.max(0,Hh-P-Y(0))}" fill="#ff5c6c" fill-opacity=".08"/>`:""}</svg>`}
function flView(){if(S.fxSemSQL&&!S.demo)return semSQL();const dias=Number(S.flHor||90);const sh=saldoHoje();const it=flItens(dias);let s=sh.v;const pts=[{d:hoje0(),s}];
  it.forEach(x=>{s+=x.v;x.s=s;pts.push({d:x.d,s})});const ent=it.filter(x=>x.v>0).reduce((t,x)=>t+x.v,0),sai=it.filter(x=>x.v<0).reduce((t,x)=>t+x.v,0);
  const min=pts.reduce((m,p)=>p.s<m.s?p:m,pts[0]);const neg=it.find(x=>x.s<0);const atr=it.filter(x=>x.atr);
  const byM={};it.forEach(x=>{const k=monthKey(x.d);(byM[k]=byM[k]||[]).push(x)});
  return `<div class="row" style="margin-bottom:10px;align-items:center">${chips("flHor",FL_HOR,String(dias))}<span style="flex:1"></span><button class="btn sm" data-act="flSaldo">Informar saldo do banco</button></div>
  <div class="grid kpis" style="margin-bottom:12px"><div class="card kpi vol"><div class="l">Saldo hoje</div><div class="n">${brl(sh.v)}</div><div class="small">${sh.base?`banco ${ddmm(sh.base.data)}: ${brl(sh.base.valor)} + movimentos depois`:"calculado pelos lançamentos pagos"}</div></div>
   <div class="card kpi"><div class="l">Vai entrar</div><div class="n pos">${brl(ent)}</div></div><div class="card kpi"><div class="l">Vai sair</div><div class="n neg">${brl(-sai)}</div></div>
   <div class="card kpi ${s<0?"":"cob"}" ${s<0?'style="background:#3a1016;border-color:#5c1d27"':""}><div class="l">Saldo em ${FL_HOR.find(x=>x[0]===String(dias))[1]}</div><div class="n ${s<0?"neg":""}">${brl(s)}</div><div class="small">menor saldo: ${brl(min.s)} em ${ddmm(min.d)}</div></div></div>
  ${neg?`<div class="warnbox" style="margin:0 0 12px;background:#3a1016;border-color:#5c1d27;color:#ff8a96">⚠ O caixa fica <b>negativo em ${ddmm(neg.d)}</b> (${brl(neg.s)}) se nada mudar.</div>`:""}
