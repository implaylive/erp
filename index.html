async function zipEntrada(file,nome){const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}if(e<0)return null;
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);for(let k=0;k<n;k++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),fnl=dv.getUint16(p+28,true),exl=dv.getUint16(p+30,true),cml=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const nm=new TextDecoder().decode(buf.subarray(p+46,p+46+fnl));p+=46+fnl+exl+cml;
   if(nm!==nome)continue;const lfn=dv.getUint16(off+26,true),lex=dv.getUint16(off+28,true);const data=buf.subarray(off+30+lfn+lex,off+30+lfn+lex+csz);
   const bytes=meth===0?data:new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());return new TextDecoder().decode(bytes)}return null}
async function lerArquivoTexto(f){const n=f.name.toLowerCase();
  if(f.type==="application/pdf"||n.endsWith(".pdf"))return await pdfLinhas(f);
  if(n.endsWith(".docx")){const x=await zipEntrada(f,"word/document.xml");return x?x.replace(/<\/w:p>/g,"\n").replace(/<w:tab\/>/g," ").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"'):""}
  if(/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/.test(n)){const w=await cpOcrWorker();if(!w)return "";try{return (await w.recognize(f)).data.text||""}catch(e){return ""}}
  if(/^text\//.test(f.type)||/\.(txt|csv|eml|md)$/.test(n))return await f.text();
  return ""}
async function cdArquivos(files){if(!S.cd)return;cdLerForm();const st=$("#cdLendo");if(st){st.hidden=false;st.textContent="Lendo "+files.length+(files.length===1?" arquivo":" arquivos")+"… (imagem demora um pouco na primeira vez)"}
  let txt="";for(const f of files){const t=await lerArquivoTexto(f);if(t.trim())txt+=(txt?"\n\n":"")+"── "+f.name+" ──\n"+t.trim()}
  if(st)st.hidden=true;if(!txt.trim())return toast("Não consegui ler esses arquivos. Formatos: PDF, imagem, Word (.docx) ou texto.",true);
  const ta=$("#cdTxt");if(ta){ta.value=txt.slice(0,20000);ta.closest("details").open=true}
  const r=cdParse(txt);if(!r.itens.length&&!r.vigencia_meses&&!r.pagamento)return toast("Li os arquivos, mas não achei valores. O texto ficou no campo: confira e preencha.",true);
  if(r.itens.length)S.cd.itens=r.itens;if(r.vigencia_meses)S.cd.vigencia_meses=r.vigencia_meses;if(r.pagamento)S.cd.pagamento=r.pagamento;if(r.inicio)S.cd.inicio=r.inicio;if(r.plataforma)S.cd.plataforma=r.plataforma;if(r.inclui&&r.inclui.length)S.cd.inclui=r.inclui;S.cd.aviso=r.aviso||"";await cdPos(r);
  S.cd.fontes=files.map(f=>f.name);cdRender();const ta2=$("#cdTxt");if(ta2){ta2.value=txt.slice(0,20000)}toast("Li "+files.length+(files.length===1?" arquivo":" arquivos")+" · confira os campos")}

  ${cl("Do objeto",`<p>1. A IMPLAY prestará à CONTRATANTE os serviços de planejamento, produção e operação de lives de vendas no perfil da CONTRATANTE na plataforma ${plat}, incluindo apresentação por live sellers treinados, operação técnica e comercial da transmissão (produtos fixados, ofertas relâmpago e cupons), estrutura de áudio, vídeo e iluminação, e relatório de resultados.</p>
   <p>2. A quantidade de lives, a duração, a categoria de estrutura, os valores, o percentual sobre vendas, a forma de pagamento e o prazo estão ${o.direto?"nas condições comerciais":"na proposta comercial "+on(o.numero)}, que integram este contrato como <b>Anexo I</b>.</p>

   <p>3. A IMPLAY manterá o padrão técnico de imagem, áudio, internet e fluxo comercial durante toda a live.</p>

  ${cl("Do cenário e da estrutura",`<p>1. A IMPLAY fornece a estrutura de estúdio e equipamentos descrita no Anexo I, com ambientação compatível com a identidade da marca. Mudanças no cenário que envolvam a marca serão aprovadas pela CONTRATANTE.</p>

  ${cl("Do acesso à conta e aos sistemas da marca",`<p>1. A CONTRATANTE concederá à IMPLAY acesso à conta da marca na plataforma e às ferramentas necessárias à transmissão e à operação de bastidores.</p>
   <p>2. A IMPLAY usará os acessos exclusivamente para executar este contrato. Alterações no perfil, no catálogo, em preços, descontos, cupons ou condições comerciais, a contratação de anúncios ou mídia paga, publicações fora das lives e demais ações de maior impacto dependem de aprovação prévia e por escrito da CONTRATANTE.</p>

  ${cl("Da remuneração e do pagamento",`<p>1. Pelos serviços, a CONTRATANTE pagará à IMPLAY os valores fixos e o percentual sobre vendas previstos no Anexo I.</p>
   <p>2. O percentual sobre vendas incide apenas sobre as vendas das lives efetivamente confirmadas, assim entendidas as vendas pagas, não canceladas nem devolvidas e com nota fiscal emitida: (a) realizadas durante a transmissão; e (b) originadas no carrinho ou nos links da live e confirmadas depois do seu encerramento, desde que atribuídas à live nos relatórios da plataforma. A emissão das notas fiscais das vendas cabe à CONTRATANTE; venda paga e não cancelada nem devolvida cuja nota deixe de ser emitida por motivo atribuível a ela integra a base de cálculo.</p>
   <p>3. As vendas serão apuradas pelos relatórios oficiais da plataforma, que são a fonte de referência. A IMPLAY enviará o relatório do mês até o 5º (quinto) dia útil do mês seguinte; a CONTRATANTE terá 5 (cinco) dias úteis para apontar divergências, sob pena de aceitação, enviando no mesmo prazo, se for o caso, o relatório das notas fiscais emitidas.</p>

  ${cl("Dos custos por conta da CONTRATANTE",`<p>1. Não estão incluídos na remuneração da IMPLAY e correm por conta da CONTRATANTE: verba de mídia paga (como GMV Max), comissões de afiliados e creators, cupons, descontos e brindes concedidos, fretes e envios, taxas e comissões da plataforma, produtos e amostras, e cenografia personalizada aprovada nos termos da Cláusula 3ª.</p><p>2. Nenhum custo adicional, inclusive mídia paga, afiliados ou outros serviços, será contratado ou realizado em nome ou por conta da CONTRATANTE sem sua aprovação prévia e por escrito, inclusive quanto ao valor.</p>`)}
  ${cl("Das alterações e cancelamentos de lives",`<p>1. Mudanças de horário ou cancelamento de uma live programada serão comunicados por escrito (aplicativo de mensagens ou e-mail) com antecedência mínima de 24 (vinte e quatro) horas.</p>
   <p>2. Live cancelada pela IMPLAY será reposta em data combinada entre as partes, sem custo. Ficam dispensados do aviso prévio os casos de queda de energia, falha de internet, instabilidade da plataforma ou outro problema técnico ou de força maior comprovado, que serão comunicados assim que possível, também com reposição da live.</p>
   <p>3. Live cancelada pela CONTRATANTE com menos de 24 (vinte e quatro) horas de antecedência, ou que não aconteça por falta de produto, acesso ou informação a cargo dela, será considerada realizada para fins de remuneração fixa.</p>`)}
  ${cl("Do prazo e da renovação",`<p>1. ${indet?`Este contrato vigora a partir de ${dBR(ini)}, por prazo indeterminado, e pode ser encerrado por qualquer parte nos termos da cláusula de rescisão.`:fim?`Este contrato vigora de ${dBR(ini)} a ${dBR(fim)}, pelo prazo de ${nx(o.vigencia_meses||3)} meses previsto no Anexo I.`:`Este contrato vigora de ${dBR(ini)} até a realização das lives previstas no Anexo I e a quitação dos valores devidos.`}</p>

  ${cl("Da rescisão",`<p>1. Qualquer parte pode encerrar este contrato sem justo motivo mediante aviso prévio por escrito de ${nx(aviso)} dias, durante os quais os serviços e os pagamentos seguem normalmente.</p>

   <p>3. O contrato pode ser rescindido de imediato, por justo motivo, mediante comunicação escrita, nos casos de: (a) descumprimento de cláusula não corrigido em 10 (dez) dias úteis após notificação; (b) caso fortuito ou força maior que impeça a execução por mais de 30 (trinta) dias; (c) falência, recuperação judicial ou extrajudicial ou dissolução de qualquer parte; (d) ato ilícito ou antiético que prejudique a imagem da outra parte; (e) suspensão ou encerramento da loja da CONTRATANTE na plataforma.</p>

   <p>2. As gravações e cortes das lives podem ser usados pela CONTRATANTE em seus canais durante a vigência e por 12 (doze) meses após o término. Usos em mídia paga ou fora desse prazo dependem de acordo com a IMPLAY e com os live sellers.</p>

const FREQ_OP=["todos os dias","a cada 2 dias","a cada 3 dias","3 vezes por semana","2 vezes por semana"];
function freqLivesMes(f){f=String(f||"").toLowerCase();if(/todo/.test(f))return 30;let m=f.match(/a cada (\d+)/);if(m)return 30/+m[1];m=f.match(/(\d+)\s*(?:vezes|x|lives?)\s*(?:por|na|\/)\s*semana/);if(m)return +m[1]*4.33;return 0}
function hrTxt(h){return [h.hmin?`mínimo de ${numIn(h.hmin)} h de live por mês`:"",h.hl?`pelo menos ${numIn(h.hl)} h por live`:"",h.freq?h.freq:h.lsem?`pelo menos ${h.lsem} lives por semana`:""].filter(Boolean).join(" · ")}
function cxFind(k){const ls=[S.oe&&S.oe.itens,S._docO&&S._docO.itens,...(S.orcs||[]).map(o=>o.itens)].filter(Boolean);for(const l of ls){const i=l.find(x=>x.k===k);if(i&&i.p)return i.p}return null}
function cxNovo(){const h=preco("hora.PADRAO")||{};return {k:"cx:"+Math.random().toString(36).slice(2,9),on:true,valor:Number(h.valor)||150,perc:Number(h.perc)||9,qtd:1,hmin:Number(h.horas)||40,hlive:3,freq:"a cada 3 dias",p:{grupo:"hora",nome:"Gestão de lives por hora",categoria:"",descricao:""}}}
function oeF(k,f,label,v,o={}){return `<div class="fld"><label>${label}</label><input data-oe="${f}" data-k="${k}"${f==="perc"?' data-fav="" data-fav-key="perc-vendas" data-fav-un="%"':""} ${o.txt?"":`inputmode="${o.int?"numeric":"decimal"}"`} value="${o.txt?esc(v??""):(v===""||v==null?"":numIn(v))}" placeholder="${o.ph||""}"></div>`}
function oeCalc(k){const p=preco(k),it=oeItem(k);const fx=v=>brl(v).replace(",00","");const pc=Number(it.perc)?` + <b>${numIn(it.perc)}%</b> das vendas nas lives`:"";
  if(p.grupo==="hora"){const h=hrDe(it,p);if(!h.vh||!h.hmin)return `<span class="muted">Preencha valor da hora e mínimo de horas.</span>`;
    const lm=freqLivesMes(h.freq),est=Math.round(lm*h.hl);const tab=p.chave&&Number(p.valor);
    return `<b>${fx(h.vh)}</b>/hora × <b>${numIn(h.hmin)} h</b> = <b class="cdv">${fx(h.mensal)}/mês</b>${pc}
     ${h.hl&&lm?`<div class="small muted" style="margin-top:3px">${numIn(h.hl)} h ${esc(h.freq)} ≈ ${est} h por mês${est<h.hmin?` <span style="color:#ffb648">⚠ abaixo do mínimo de ${numIn(h.hmin)} h: aumente as horas por live ou a frequência</span>`:""}</div>`:""}
     ${tab&&h.vh!==tab?`<div class="small" style="margin-top:3px;color:${h.vh<tab?"var(--flash)":"var(--ok)"}">${h.vh<tab?`Abaixo da tabela (${fx(tab)}/h): o cliente vê o preço de tabela riscado`:`Acima da tabela (${fx(tab)}/h): o cliente vê só o preço novo`}</div>`:""}`}
  const q=p.grupo==="pontual"?(Number(it.qtd)||1):1;const v=Number(it.valor)||0;
  return v?`${q>1?q+" × ":""}<b>${fx(v)}</b>${p.grupo==="pacote"?"/mês":p.grupo==="pontual"?"/live":""}${q>1?` = <b class="cdv">${fx(v*q)}</b>`:""}${pc}`:`<span class="muted">Sem valor fixo</span>${pc}`}
function oeModCard(k){const p=preco(k),it=oeItem(k);const cx=k.startsWith("cx:");const g=p.grupo;const h=hrDe(it,p);
  const freqChips=`<div class="fld"><label>Frequência mínima</label><div class="pchips">${FREQ_OP.map(f=>`<button type="button" class="pch ${f===h.freq?"on":""}" data-act="oeFreq" data-k="${k}" data-v="${f}">${f}</button>`).join("")}</div><input data-oe="freq" data-k="${k}" value="${esc(h.freq||"")}" placeholder="Outra: ex. de segunda a sexta" class="pin2"></div>`;

   <div class="cdsub">Quanto custa</div><div class="cdg">${cus}</div>
   ${vol?`<div class="cdsub">Quanto de live</div><div class="cdg">${vol}</div>${g==="hora"?freqChips:""}`:""}
   <div class="cdcalc" data-ocalc="${k}">${oeCalc(k)}</div>

  ${cl("Cláusula 2 – Responsabilidade pelos equipamentos",`<p>A CONTRATANTE assume a responsabilidade pela segurança e integridade dos equipamentos durante todo o período em que estes permanecerem no local da prestação dos serviços, compreendendo desde sua chegada, instalação e montagem até sua desmontagem e retirada definitiva.</p><p>A responsabilidade da CONTRATANTE abrange, dentre outras ocorrências:</p><p>a) Roubo, furto, extravio ou desaparecimento de equipamentos e acessórios;</p><p>b) Danos causados por colaboradores, funcionários, prestadores de serviços, visitantes, convidados ou quaisquer terceiros presentes no local;</p><p>c) Danos decorrentes de quedas, impactos, colisões, derramamento de líquidos ou manuseio indevido por pessoas não autorizadas;</p><p>d) Danos elétricos decorrentes de oscilações de tensão, quedas de energia, surtos elétricos, curtos-circuitos, ausência de aterramento ou inadequação das instalações elétricas;</p><p>e) Danos decorrentes de infiltrações, alagamentos, incêndios, umidade excessiva ou condições ambientais inadequadas;</p><p>f) Quaisquer outros danos, perdas ou avarias decorrentes de ocorrências relacionadas à infraestrutura, à segurança ou às condições do local indicado pela CONTRATANTE.</p>`)}
  ${cl("Cláusula 3 – Obrigações da CONTRATANTE",`<p>A CONTRATANTE compromete-se a:</p><p>a) Disponibilizar ambiente seguro e adequado à instalação e operação dos equipamentos;</p><p>b) Garantir instalações elétricas compatíveis, estáveis e em condições adequadas de funcionamento;</p><p>c) Impedir o acesso, manuseio, deslocamento ou utilização dos equipamentos por pessoas não autorizadas pela CONTRATADA;</p><p>d) Adotar medidas razoáveis de segurança e proteção patrimonial durante todo o período da prestação dos serviços;</p><p>e) Comunicar imediatamente à CONTRATADA qualquer ocorrência que possa comprometer a segurança ou a integridade dos equipamentos.</p>`)}
  ${cl("Cláusula 4 – Ressarcimento de danos e prejuízos",`<p>Na ocorrência de dano, perda, roubo, furto ou qualquer outro evento abrangido por este termo, a CONTRATANTE deverá ressarcir integralmente a CONTRATADA pelos prejuízos comprovadamente sofridos, independentemente da identificação do terceiro responsável, quando aplicável.</p><p>O ressarcimento compreenderá:</p><p>a) Custos de avaliação técnica, diagnóstico, reparo, peças, mão de obra, transporte e demais despesas necessárias ao restabelecimento do equipamento;</p><p>b) Em caso de perda total, roubo, furto ou impossibilidade de reparo, o valor necessário à reposição do equipamento por outro novo, de mesma marca, modelo e especificações técnicas, ou equivalente, caso o modelo original não esteja disponível no mercado;</p><p>c) Custos de locação temporária de equipamentos substitutos necessários à continuidade das atividades da CONTRATADA;</p><p>d) Demais prejuízos diretos e lucros cessantes devidamente comprovados, decorrentes da indisponibilidade dos equipamentos.</p><p>O ressarcimento deverá ocorrer no prazo máximo de 10 (dez) dias úteis, contados do recebimento da notificação formal acompanhada da documentação comprobatória dos valores.</p>`)}
  ${cl("Cláusula 5 – Limitação e exclusão de responsabilidade",`<p>A CONTRATANTE não será responsabilizada por danos comprovadamente decorrentes de culpa exclusiva da CONTRATADA ou de seus profissionais, desgaste natural dos equipamentos ou defeitos preexistentes sem relação com as condições do local da prestação dos serviços.</p><p>A operação dos equipamentos permanecerá sob responsabilidade técnica da CONTRATADA, não sendo permitida sua utilização por terceiros sem autorização expressa.</p>`)}
  ${cl("Cláusula 6 – Interrupção dos serviços",`<p>A CONTRATADA reserva-se o direito de suspender ou interromper a prestação dos serviços sempre que identificar condições que possam comprometer a segurança de seus equipamentos ou de seus profissionais.</p><p>Quando a interrupção decorrer de condições inadequadas do local, falhas de infraestrutura ou descumprimento das obrigações da CONTRATANTE, não será caracterizado inadimplemento contratual por parte da CONTRATADA, permanecendo devidos os valores contratualmente previstos, observadas as condições do contrato principal.</p>`)}
  ${cl("Cláusula 7 – Vigência e disposições gerais",`<p>O presente termo permanecerá vigente durante todo o período em que os equipamentos estiverem nas dependências da CONTRATANTE ou em local por ela indicado, inclusive durante os intervalos da prestação dos serviços e períodos de armazenamento temporário.</p><p>As obrigações de ressarcimento permanecerão válidas mesmo após o encerramento da prestação dos serviços.</p><p>Este termo integra e complementa o contrato de prestação de serviços firmado entre as partes, quando existente.</p>`)}
  ${cl("Cláusula 8 – Foro",`<p>Fica eleito o Foro da Comarca de São Paulo, Estado de São Paulo, para dirimir quaisquer controvérsias decorrentes deste termo, com renúncia expressa a qualquer outro, por mais privilegiado que seja, observadas as hipóteses legais de competência obrigatória.</p><p>Por estarem de pleno acordo com as condições estabelecidas, as partes assinam o presente instrumento.</p>`)}
  <h2>Anexo I – Relação de equipamentos</h2>
  ${itens.length?`<table class="atb"><tr><th>Equipamento</th><th>Nº / série</th><th class="r">Qtd.</th><th class="r">Valor unit. de reposição</th><th class="r">Total</th></tr>${itens.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc([x.num,x.serie].filter(Boolean).join(" · ")||"—")}</td><td class="r">${x.q}</td><td class="r">${x.v!=null?brl(x.v):"—"}</td><td class="r">${x.v!=null?brl(x.v*x.q):"—"}</td></tr>`).join("")}${tot?`<tr><td colspan="4" class="r"><b>Total</b></td><td class="r"><b>${brl(tot)}</b></td></tr>`:""}</table><p class="num">Os valores acima são referências de reposição na data deste termo e não limitam o ressarcimento previsto na Cláusula 4.</p>`:`<p><span class="ph">[nenhum equipamento marcado]</span></p>`}
  <p class="local">Local e data: São Paulo, ____ de ______________ de ______.</p>
  <div class="assin">${linhas(["CONTRATANTE",ph(f.razao,"Razão social"),ph(f.rep_cli,"Representante")])}${linhas(["CONTRATADA – IMplay",EMPRESA.razao,esc(f.rep_imp||"")])}</div>
  <div class="assin"><div><div class="ln"></div>Testemunha 1<br>Nome / CPF</div><div><div class="ln"></div>Testemunha 2<br>Nome / CPF</div></div></div>`}
document.addEventListener("change",e=>{if(e.target.id!=="trCli")return;const c=S.clientes.find(x=>x.id===e.target.value);if(!c)return;const F=$("#trF");const set=(n,v)=>{const el=F.querySelector(`[name=${n}]`);if(el&&v)el.value=v};
  set("razao",c.empresa);set("cnpj",c.cnpj);set("local",[c.endereco,c.cep?"CEP "+c.cep:""].filter(Boolean).join(", "));set("rep_cli",c.rep_nome)},true);

  if(a.dataset.act==="trNovo")return openTermoEq();
  const F=$("#trF");const fd=new FormData(F);const f={};fd.forEach((v,k)=>f[k]=typeof v==="string"?v.trim():v);
  const itens=[];(S._trItens||[]).forEach((x,i)=>{if(f["eq_"+i])itens.push({nome:x.nome,num:x.num,serie:x.serie,q:Math.max(1,parseInt(f["q_"+i])||1),v:trNum(f["v_"+i])})});

  if(!itens.length)return toast("Marque pelo menos um equipamento",true);
  S.docNome="Termo equipamentos "+(f.razao||"cliente");closeSheet();showCtr(termoEqHtml(f,itens))},true);

/* ---------- v53: materiais do cliente · promoções da live · checklist do dia ---------- */
const CLI_BUCKET="implay-cli";S.cliMat=S.cliMat||[];
const _loadAll53=loadAll;loadAll=async function(){await _loadAll53();if(S.demo)return;const r=await db.from("imp_cli_mat").select("*").order("created_at",{ascending:false});S.matSemSQL=!!r.error;S.cliMat=r.data||[];const mb=document.getElementById("matBox");if(mb&&mb.dataset.cli)matRefresh(mb.dataset.cli)};
function matDe(cid){return (S.cliMat||[]).filter(m=>m.cliente_id===cid)}
function matLista(cid,podeApagar=true){const l=matDe(cid);if(!l.length)return `<div class="small muted">Nenhum material ainda.</div>`;
  return `<div class="matl">${l.map(m=>`<div class="mati"><span class="matic">${m.tipo==="link"?"🔗":/pdf/i.test(m.mime||m.arquivo_nome||"")?"📄":"📎"}</span><a href="#" data-act="matAbrir" data-id="${m.id}">${esc(m.titulo)}</a><span class="small muted">${m.tipo==="link"?esc((m.url||"").replace(/^https?:\/\//,"").slice(0,40)):esc(m.arquivo_nome||"")}</span>${podeApagar?`<button type="button" class="btn d sm" data-act="matDel" data-id="${m.id}">Apagar</button>`:""}</div>`).join("")}</div>`}
function matBox(cid){if(S.matSemSQL)return `<div class="warnbox">Rode o SQL da Versão 53 para guardar materiais.</div>`;
  return `<div class="sbox" id="matBox" data-cli="${cid}"><label style="font-weight:700">📚 Materiais e treinamentos dos produtos</label><div class="small muted" style="margin:-2px 0 8px">PDFs, apresentações e links de treinamento. Aparecem na live e no checklist do dia.</div>
  <div id="matList">${matLista(cid)}</div>
  <input type="file" id="matFile" multiple accept=".pdf,image/*,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.mp4,.mov">
  <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><input id="matLT" placeholder="Título do link (ex.: Treinamento linha verão)" style="flex:1;min-width:160px"><input id="matLU" placeholder="https://…" style="flex:1;min-width:160px"><button type="button" class="btn sm" data-act="matLink">+ Link</button></div></div>`}
function matRefresh(cid){const b=$("#matList");if(b)b.innerHTML=matLista(cid)}
const _openCli53=openCli;openCli=function(id){_openCli53(id);if(!id)return;const f=$("#cliForm");if(!f)return;const acts=f.querySelector(".acts");const h=matBox(id);acts?acts.insertAdjacentHTML("beforebegin",h):f.insertAdjacentHTML("beforeend",h)};
document.addEventListener("change",async e=>{if(e.target.id!=="matFile")return;const box=$("#matBox");if(!box)return;const cid=box.dataset.cli;const files=[...e.target.files];e.target.value="";
  for(const file of files){if(file.size>50*1048576){toast(file.name+": maior que 50 MB",true);continue}
    toast("Enviando "+file.name+"…");const safe=file.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]+/g,"_");const path=`${cid}/${Date.now().toString(36)}_${safe}`;
    const up=await db.storage.from(CLI_BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});if(up.error){toast("Não subiu: "+up.error.message,true);continue}
    const r=await db.from("imp_cli_mat").insert({cliente_id:cid,tipo:"arquivo",titulo:file.name.replace(/\.[^.]+$/,""),caminho:path,arquivo_nome:file.name,mime:file.type||null,tamanho:file.size}).select("*").single();
    if(r.error){await db.storage.from(CLI_BUCKET).remove([path]);toast("Não salvou: "+r.error.message,true);continue}S.cliMat.unshift(r.data);matRefresh(cid)}
  if(files.length)toast("Material salvo")},true);
document.addEventListener("click",async e=>{const a=e.target.closest("[data-act=matLink],[data-act=matAbrir],[data-act=matDel]");if(!a)return;e.preventDefault();e.stopImmediatePropagation();const act=a.dataset.act;
  if(act==="matLink"){const cid=$("#matBox").dataset.cli;let u=($("#matLU").value||"").trim();const t=($("#matLT").value||"").trim();if(!u)return toast("Cole o link",true);if(!/^https?:\/\//i.test(u))u="https://"+u;
    const r=await db.from("imp_cli_mat").insert({cliente_id:cid,tipo:"link",titulo:t||u.replace(/^https?:\/\//,"").slice(0,60),url:u}).select("*").single();if(r.error)return toast("Não salvou: "+r.error.message,true);S.cliMat.unshift(r.data);matRefresh(cid);$("#matLT").value="";$("#matLU").value="";return toast("Link salvo")}
  const m=S.cliMat.find(x=>x.id===a.dataset.id);if(!m)return;
  if(act==="matAbrir"){if(m.tipo==="link")return window.open(m.url,"_blank");const w=window.open("","_blank");const {data,error}=await db.storage.from(CLI_BUCKET).createSignedUrl(m.caminho,900);if(error||!data){w&&w.close();return toast("Não abriu o arquivo",true)}if(w)w.location=data.signedUrl;else location.href=data.signedUrl;return}
  if(act==="matDel"){if(!armed(a))return;const r=await db.from("imp_cli_mat").delete().eq("id",m.id);if(r.error)return toast("Não apagou: "+r.error.message,true);if(m.caminho)await db.storage.from(CLI_BUCKET).remove([m.caminho]);S.cliMat=S.cliMat.filter(x=>x.id!==m.id);matRefresh(m.cliente_id);toast("Apagado")}},true);

/* promoções da live */
function prRow(p={}){return `<div class="prr"><input data-pr="produto" value="${esc(p.produto||"")}" placeholder="Produto"><input data-pr="preco" value="${esc(p.preco||"")}" placeholder="De R$" inputmode="decimal"><input data-pr="preco_live" value="${esc(p.preco_live||"")}" placeholder="Por R$" inputmode="decimal"><input data-pr="hora" value="${esc(p.hora||"")}" placeholder="Hora (opc.)"><label class="prf"><input type="checkbox" data-pr="flash" ${p.flash?"checked":""}> ⚡ Flash</label><button type="button" class="btn sm" data-act="prDel" title="Tirar">×</button></div>`}
function jobPromosHtml(j){const l=Array.isArray(j.promocoes)?j.promocoes:[];return `<details class="sbox prbox" ${l.length?"open":""}><summary><b>🔥 Promoções da live</b> <span class="small muted">(opcional · ${l.length} produto${l.length===1?"":"s"})</span></summary>
  <div class="small muted" style="margin:6px 0">Produto, preço normal, preço na live e se é flash sale. Aparece no checklist do dia para o operador cadastrar na plataforma.</div>
  <div id="prList">${l.map(prRow).join("")}</div>
  <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="prAdd">+ Produto</button><button type="button" class="btn sm" data-act="prCopiar">Copiar da última live desta marca</button></div></details>`}
function jobPromosLer(){const l=[];document.querySelectorAll("#prList .prr").forEach(r=>{const g=k=>{const el=r.querySelector(`[data-pr=${k}]`);return el.type==="checkbox"?el.checked:el.value.trim()};const o={produto:g("produto"),preco:g("preco"),preco_live:g("preco_live"),hora:g("hora"),flash:g("flash")};if(o.produto)l.push(o)});return l}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act=prAdd],[data-act=prDel],[data-act=prCopiar]");if(!a)return;e.preventDefault();e.stopImmediatePropagation();
  if(a.dataset.act==="prAdd"){$("#prList").insertAdjacentHTML("beforeend",prRow());const r=$("#prList").lastElementChild;r&&r.querySelector("input").focus();return}
  if(a.dataset.act==="prDel"){a.closest(".prr").remove();return}
  const F=a.closest("form");const marca=(F.querySelector("[name=marca]")||{}).value||"";const cid=(F.querySelector("[name=cliente_id]")||{}).value||"";
  const ult=S.jobs.filter(j=>Array.isArray(j.promocoes)&&j.promocoes.length&&((cid&&j.cliente_id===cid)||(marca&&(j.marca||"").toLowerCase()===marca.toLowerCase()))).sort((x,y)=>new Date(y.inicio)-new Date(x.inicio))[0];
  if(!ult)return toast("Nenhuma live anterior dessa marca com promoções",true);$("#prList").innerHTML=ult.promocoes.map(prRow).join("");toast("Copiado da "+jn(ult.numero))},true);

/* checklist do dia */
const CHECK_ITENS=[["seller","Seller confirmado e no local"],["produtos","Produtos e amostras separados"],["promos","Promoções e flash sales cadastradas na plataforma"],["carrinho","Produtos fixados no carrinho / vitrine"],["roteiro","Roteiro e materiais revisados com o seller"],["cenario","Cenário montado"],["equip","Câmera, luz e microfone testados"],["internet","Internet e transmissão testadas"],["conta","Celular e conta da marca logados e carregados"]];
S.chkDia=S.chkDia||"hoje";
function chkCard(j){const ck=j.checklist||{};const ok=CHECK_ITENS.filter(([k])=>ck[k]&&ck[k].ok).length;const pc=Math.round(ok/CHECK_ITENS.length*100);const pr=Array.isArray(j.promocoes)?j.promocoes:[];const mats=j.cliente_id?matDe(j.cliente_id):[];
  const sel=S.membros.find(m=>m.id===j.principal_id);const i=new Date(j.inicio),f=new Date(j.fim||j.inicio);
  return `<div class="k53 ${pc===100?"done":""}"><div class="k53h"><div><b class="k53t">${hm(i)}–${hm(f)} · ${esc(j.marca||"Live")}</b> ${typeof platTag==="function"?platTag(j):""}<div class="small muted">${jn(j.numero)} · ${j.local_tipo==="estudio"?"Estúdio"+(j.espaco?" "+esc(j.espaco):""):j.local_tipo==="online"?"Online":"Externa · "+esc(j.local_endereco||"")}${sel?" · 🎤 "+esc(sel.nome):""}</div></div>
   <div class="k53p"><b>${ok}/${CHECK_ITENS.length}</b><div class="k53bar"><span style="width:${pc}%"></span></div></div></div>
   <div class="k53i">${CHECK_ITENS.map(([k,t])=>{const c=ck[k];return `<label class="k53l ${c&&c.ok?"ok":""}"><input type="checkbox" data-chk="${k}" data-job="${j.id}" ${c&&c.ok?"checked":""}><span>${t}${k==="promos"&&pr.length?` <b>(${pr.length})</b>`:""}${c&&c.ok?`<small> · ${esc(c.por||"")} ${c.em?new Date(c.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):""}</small>`:""}</span></label>`}).join("")}</div>
   ${pr.length?`<details class="k53d"><summary>🔥 Promoções (${pr.length})</summary><table class="atb k53pt"><thead><tr><th>Produto</th><th>De</th><th>Por</th><th>Hora</th><th>Flash</th></tr></thead><tbody>${pr.map(p=>`<tr><td>${esc(p.produto)}</td><td>${esc(p.preco||"—")}</td><td><b>${esc(p.preco_live||"—")}</b></td><td>${esc(p.hora||"—")}</td><td>${p.flash?"⚡ sim":"—"}</td></tr>`).join("")}</tbody></table></details>`:""}
   ${mats.length?`<details class="k53d"><summary>📚 Materiais da marca (${mats.length})</summary>${matLista(j.cliente_id,false)}</details>`:""}
   <div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" data-act="job" data-id="${j.id}">Abrir live</button></div></div>`}
function chkView(){const base=new Date(new Date().toDateString());if(S.chkDia==="amanha")base.setDate(base.getDate()+1);const fim=new Date(base.getTime()+864e5);
  const l=S.jobs.filter(j=>j.status!=="cancelado"&&new Date(j.inicio)>=base&&new Date(j.inicio)<fim).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio));
  const tot=l.length*CHECK_ITENS.length,ok=l.reduce((s,j)=>s+CHECK_ITENS.filter(([k])=>(j.checklist||{})[k]&&(j.checklist||{})[k].ok).length,0);
  const tg=`<div class="chips" style="margin:0 0 10px"><button data-act="chkDia" data-v="hoje" class="${S.chkDia==="hoje"?"on":""}">Hoje</button><button data-act="chkDia" data-v="amanha" class="${S.chkDia==="amanha"?"on":""}">Amanhã</button></div>`;
  if(S.jobs.length&&S.jobs[0].checklist===undefined)return tg+`<div class="warnbox">Rode o SQL da Versão 53 para ligar o checklist.</div>`;
  return tg+(l.length?`<div class="okbox" style="margin-bottom:10px">${l.length} live${l.length>1?"s":""} · <b>${ok} de ${tot}</b> itens feitos${tot&&ok===tot?" · tudo pronto ✅":""}</div><div class="k53g">${l.map(chkCard).join("")}</div>`:`<div class="empty">Nenhuma live ${S.chkDia==="hoje"?"hoje":"amanhã"}.</div>`)}

function cliContrato(cid){const o=(S.orcs||[]).filter(x=>x.cliente_id===cid&&x.status==="aprovado").sort((a,b)=>new Date(b.aprovado_em||b.created_at)-new Date(a.aprovado_em||a.created_at))[0];if(!o)return null;

function horasJob(j){return Math.max(0,(new Date(j.fim||j.inicio)-new Date(j.inicio))/36e5)}
function cenMes(cid){const mk=monthKey(new Date());const l=S.jobs.filter(j=>j.cliente_id===cid&&j.status!=="cancelado"&&monthKey(new Date(j.inicio))===mk);const agora=new Date();

function cenResumo(c){const ct=cliContrato(c.id);const m=cenMes(c.id);const mesN=new Date().toLocaleDateString("pt-BR",{month:"long"});
  let ctr=`<div class="cbox"><h4>📄 O que está no contrato</h4><div class="muted small">Nenhuma proposta aprovada para esta marca.</div></div>`;
  if(ct){ctr=`<div class="cbox"><h4>📄 O que está no contrato <span class="small muted">· proposta ${String(ct.o.numero||"").padStart(4,"0")}${ct.o.vigencia_meses?` · ${ct.o.vigencia_meses} meses`:""}</span></h4>${ct.itens.map(({i,p,h})=>h?`<div class="cbig"><div><span class="k">Horas por mês</span><b>${fH(h.hmin)}</b></div><div><span class="k">Lives por semana</span><b>${h.lsem||"—"}</b></div><div><span class="k">Horas por live</span><b>${h.hl?fH(h.hl):"—"}</b></div><div><span class="k">Frequência</span><b>${esc(h.freq||"—")}</b></div></div><div class="small muted">${esc(p.categoria||"Hora de live")} · ${brl(i.valor)}/hora · + ${i.perc}% ${percAlvo(p)}</div>`
      :`<div class="crow"><b>${esc(p.categoria||i.k)}</b>${i.qtd>1?` × ${i.qtd}`:""} <span class="muted">· ${brl(i.valor)}${i.perc?` + ${i.perc}% ${percAlvo(p)}`:""}</span></div>`).join("")}</div>`}
  const h=ct&&ct.itens.find(x=>x.h);const pct=h&&h.h.hmin?Math.min(100,m.hTot/h.h.hmin*100):0;

function cenLives(cid,curto){const agora=new Date();let l=S.jobs.filter(j=>j.cliente_id===cid&&j.status!=="cancelado");const fut=l.filter(j=>new Date(j.fim||j.inicio)>=agora).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio));const pas=l.filter(j=>new Date(j.fim||j.inicio)<agora).sort((a,b)=>new Date(b.inicio)-new Date(a.inicio)).slice(0,15);

<script>
/* ===== Regra 7 · Um clique: opções favoritas + campo livre (Tae · 29/10/2026) =====
   Módulo genérico, sem dependências. Cole antes de </body> (ou dentro do script principal).
   O que faz, sozinho, em qualquer tela (MutationObserver):
   1) <select> com até 6 opções curtas  → vira botões lado a lado (1 clique). O select continua no formulário, escondido.
   2) <select> maior                      → ganha os favoritos dele em botões acima da lista.
   3) <input type=number> com rótulo      → ganha a linha de favoritos: [12%] [15%] [20%] [+ favorito] [✎]
      e campos de texto marcados com data-fav também.
   Favoritos: "+ favorito" guarda o valor que está no campo; "✎" mostra o × para tirar. Valem por pessoa e por aparelho.
   Padrões por campo: data-fav="10,15,20" (sugestões iniciais). Unidade nos botões: data-fav-un="%" ou "R$" (ou detecta pelo rótulo).
   Desligar num campo ou num bloco: data-1c="off". Chave própria: data-fav-key="desconto-valor".
   Botões do select: data-1c="botoes" força botões; data-1c="lista" força lista. */
(function () {
  if (window.__umclique) return; window.__umclique = true;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const off = el => !!el.closest('[data-1c="off"]') && el.dataset['1c'] !== 'botoes';

  const css = document.createElement('style');
  css.textContent =
    '.uc-hid{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;overflow:hidden!important}' +
    '.uc-seg{display:flex;flex-wrap:wrap;gap:6px}' +
    '.uc-seg button,.uc-fav button{font:inherit;font-size:13px;line-height:1.2;border:1px solid var(--line,var(--linha,#262626));background:var(--surface,var(--card,#141414));color:inherit;border-radius:999px;padding:7px 12px;min-height:34px;cursor:pointer}' +
    '.uc-seg button[aria-pressed="true"]{background:var(--accent,var(--volt,#D5FF3F));border-color:var(--accent,var(--volt,#D5FF3F));color:var(--on-accent,#000);font-weight:600}' +
    '.uc-seg button:disabled,.uc-fav button:disabled{opacity:.5;cursor:default}' +
    '.uc-fav{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}' +
    '.uc-fav .uc-v[aria-pressed="true"]{border-color:var(--accent,var(--voltx,#D5FF3F));color:var(--accent,var(--voltx,#D5FF3F));font-weight:600}' +
    '.uc-fav .uc-add,.uc-fav .uc-ed{border-style:dashed;color:var(--muted,var(--cinza,#A3A3AB))}' +
    '.uc-fav .uc-x{margin-left:6px;font-weight:700;opacity:.7}' +
    '.uc-fav.uc-vazio{display:none}' +
    ':focus-within>.uc-fav.uc-vazio,.uc-fav.uc-vazio:focus-within{display:flex}';
  document.head.appendChild(css);

  const setVal = (el, v) => {
    const d = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');

    el.dispatchEvent(new Event('change', { bubbles: true }));

    const opcoes = () => [...sel.options].filter(o => o.value !== '__outra' && (o.value !== '' || !/^[—–-]*$/.test(o.text.trim())));
    const ops0 = opcoes();

    if (forca === 'lista') return false;
    // poucas opções curtas (até 10, somando até ~90 letras: cabem em duas linhas) viram botões
    const letras = ops0.reduce((t, o) => t + o.text.trim().length, 0);
    if (forca !== 'botoes' && (ops0.length < 2 || ops0.length > 10 || letras > 90 || ops0.some(o => o.text.trim().length > 40) || sel.multiple)) return false;

        (temOutra ? '<button type="button" data-v="__outra" aria-pressed="' + (sel.value === '__outra') + '"' + (sel.disabled ? ' disabled' : '') + '>Outra…</button>' : '');

        (el.disabled || el.readOnly ? '' : '<button type="button" class="uc-add" title="Guarda o valor que está no campo como botão">+ favorito</button>' + (L.length ? '<button type="button" class="uc-ed" aria-pressed="' + editando + '" title="Tirar favoritos">' + (editando ? 'Pronto' : '✎') + '</button>' : ''));
    };
    box.addEventListener('mousedown', e => e.preventDefault()); // não tira o foco do campo
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.classList.contains('uc-add')) {
        const v = String(el.value ?? '').trim();
        if (!v || v === '__outra') { el.focus(); el.setAttribute('placeholder', 'Digite ou escolha e toque em + favorito'); return; }
        const L = lista().filter(x => String(x) !== v); L.push(v);
        if (el.type === 'number') L.sort((a, b) => Number(a) - Number(b));

      }
      if (b.classList.contains('uc-ed')) { editando = !editando; desenha(); return; }
      if (editando && e.target.closest('.uc-x')) { gravar(k, lista().filter(x => String(x) !== b.dataset.v)); desenha(); return; }
